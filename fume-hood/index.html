r 10⁻³⁸. The colour tells you the oxidation state: iron(II) gives a dirty green precipitate that browns in air as it oxidizes to iron(III).","remember":"Fe²⁺ + OH⁻ → green. Fe³⁺ + OH⁻ → rust brown.","speed":1,"credit":{"artist":"FilHru","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","page":"https://commons.wikimedia.org/wiki/File:Sr%C3%A1%C5%BEec%C3%AD_reakce_chloridu_%C5%BEeleznat%C3%A9ho_s_hydroxidem_draseln%C3%BDm_za_vzniku_hydroxidu_%C5%BEelezit%C3%A9ho.webm"}},{"id":"chem-garden","topic":"precip","types":["precipitation","osmosis"],"title":"Metal salt crystals in sodium silicate","nick":"Chemical garden","color":"#3aa0c9","colorName":"copper silicate blue","eq":{"l":"M^2+(aq) + SiO3^2-(aq)","r":"MSiO3(s)"},"see":"Coloured tubes and stalks grow upward from each crystal.","why":"Each crystal starts to dissolve and instantly wraps itself in a membrane of insoluble metal silicate. Water moves in through the membrane by osmosis, the pressure bursts it, fresh metal ions meet more silicate, and a new section of tube forms. Buoyancy sends the growth upward.","remember":"Precipitate membrane + osmosis = growing tubes.","speed":1,"credit":{"artist":"mgregggphone","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Growth_of_a_chemical_garden.ogv"}},{"id":"naoh-tests","topic":"precip","types":["precipitation","analysis"],"yt":{"id":"3B5Sqp_J5t8","start":9,"end":38,"author":"Royal Society of Chemistry"},"title":"Transition metal ions + sodium hydroxide","nick":"Identify the ion by its precipitate","color":"#3b8fe0","colorName":"copper(II) hydroxide blue","eq":{"l":"M^n+(aq) + nOH^-(aq)","r":"M(OH)n(s)"},"pairs":[["Fe^3+","orange-brown","#c0652a"],["Fe^2+","dirty green","#7d9a3c"],["Cu^2+","pale blue","#4ea3e8"]],"see":"A few drops of sodium hydroxide give a coloured precipitate in each tube.","why":"Most transition metal hydroxides are insoluble, and their colours come from the metal ion's d electrons, so the precipitate identifies the ion. Iron(II) hydroxide slowly turns brown at the surface as air oxidizes it to iron(III).","remember":"Fe³⁺ brown · Fe²⁺ green · Cu²⁺ blue.","credit":{"artist":"Royal Society of Chemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=3B5Sqp_J5t8&t=9s"}},{"id":"prussian-blue","topic":"precip","types":["precipitation","analysis"],"yt":{"id":"x3xzw_sTcMs","start":0,"end":47,"author":"Colorful Chemistry"},"title":"Iron(III) + hexacyanoferrate(II)","nick":"Prussian blue","color":"#1f4fd0","colorName":"Prussian blue","eq":{"l":"4Fe^3+(aq) + 3[Fe(CN)6]^4-(aq)","r":"Fe4[Fe(CN)6]3(s)"},"see":"Drops of one solution blooming through the other turn into an intensely deep blue.","why":"Prussian blue contains iron in two oxidation states, Fe(II) bound to carbon and Fe(III) bound to nitrogen. Light can push an electron from Fe(II) to Fe(III) (intervalence charge transfer), which absorbs red-orange light very strongly, so the solid is an intense blue. It is a classic test for Fe³⁺.","remember":"Fe³⁺ + ferrocyanide → Prussian blue. Colour from Fe(II) → Fe(III) electron hopping.","credit":{"artist":"Colorful Chemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=x3xzw_sTcMs&t=0s"}},{"id":"thiosulfate","topic":"precip","types":["disproportionation","kinetics"],"yt":{"id":"eCW3uHuBsUE","start":0,"end":22,"author":"Sam Murfitt"},"title":"Sodium thiosulfate + hydrochloric acid","nick":"The disappearing cross","color":"#e8e2a0","colorName":"colloidal sulfur yellow","eq":{"l":"Na2S2O3(aq) + 2HCl(aq)","r":"2NaCl(aq) + S(s) + SO2(g) + H2O(l)"},"see":"The clear solution slowly clouds pale yellow until the cross drawn underneath disappears.","why":"In acid, thiosulfate (average sulfur oxidation state +2) disproportionates into solid sulfur (0) and sulfur dioxide (+4). The sulfur forms as a fine colloid that gradually blocks the view. Timing how long the cross takes to vanish at different concentrations or temperatures is a standard rate experiment.","remember":"Cloudiness = colloidal sulfur. Time to hide the cross ∝ 1/rate.","credit":{"artist":"Sam Murfitt","license":"YouTube","page":"https://www.youtube.com/watch?v=eCW3uHuBsUE&t=0s"}},{"id":"ni-complexes","topic":"complex","types":["ligand substitution"],"title":"Nickel(II) + five ligands","nick":"One metal, five colours","color":"#5fbf7a","colorName":"hexaaquanickel green","eq":{"l":"[Ni(H2O)6]^2+(aq) + 6NH3(aq)","r":"[Ni(NH3)6]^2+(aq) + 6H2O(l)"},"more":[{"label":"Ethylenediamine (purple)","l":"[Ni(H2O)6]^2+ + 3en","r":"[Ni(en)3]^2+ + 6H2O"},{"label":"Dimethylglyoxime (red precipitate)","l":"Ni^2+ + 2dmgH2","r":"Ni(dmgH)2(s) + 2H^+"},{"label":"Cyanide (yellow)","l":"Ni^2+ + 4CN^-","r":"[Ni(CN)4]^2-"}],"see":"The same nickel solution goes green, blue, purple, pink-red and yellow in five glasses.","why":"Ligands split the d-orbital energies by different amounts, following the spectrochemical series {H2O} \u003c {NH3} \u003c en \u003c {CN^-}. A larger splitting means higher-energy light is absorbed, so the colour shifts. Strong-field cyanide makes Ni(II) (d⁸) square planar; it absorbs violet light and looks yellow.","remember":"Ni²⁺: water green · NH₃ blue · en purple · dmg red · CN⁻ yellow.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:44._%D0%9A%D0%BE%D0%BC%D0%BF%D0%BB%D0%B5%D0%BA%D1%81%D0%B8_%D0%BD%D0%B0_%D0%BD%D0%B8%D0%BA%D0%B5%D0%BB.ogg"}},{"id":"fe-scn","topic":"complex","types":["ligand substitution","analysis"],"title":"Iron(III) + thiocyanate","nick":"Fake blood","color":"#c0142d","colorName":"blood red","eq":{"l":"Fe^3+(aq) + SCN^-(aq)","a":"\u003c=>","r":"[Fe(SCN)]^2+(aq)"},"see":"A \"knife\" wet with iron(III) chloride leaves a blood-red line on skin wiped with thiocyanate.","why":"Thiocyanate replaces a water ligand on iron(III) to give the intensely red {[Fe(SCN)(H2O)5]^2+}. It is so strongly coloured that it detects traces of {Fe^3+}, and it is the textbook Le Chatelier demonstration: add more {Fe^3+} or {SCN^-} and the red deepens.","remember":"Blood red = test for Fe(III). The Le Chatelier example.","speed":1,"credit":{"artist":"Дени Ингилизовски","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:92._%D0%92%D0%B5%D1%88%D1%82%D0%B0%D1%87%D0%BA%D0%B0_%D0%BA%D1%80%D0%B2.ogg"}},{"id":"ni-dmg","topic":"complex","types":["precipitation","analysis"],"title":"Nickel(II) + dimethylglyoxime","nick":"Strawberry-red test","color":"#e0405a","colorName":"strawberry red","eq":{"l":"Ni^2+(aq) + 2dmgH2(aq)","r":"Ni(dmgH)2(s) + 2H^+(aq)"},"see":"The reagent turns pure Ni²⁺ solution red, and also picks nickel out of the bottle of mixed metal ions.","why":"Each dimethylglyoxime loses one H⁺ and binds nickel through two nitrogens, giving a flat, square-planar complex held together by O–H···O hydrogen bonds. It is highly selective, so it finds nickel even in a mixture of eight different metal ions. Base is added to take up the released H⁺.","remember":"Pink-red precipitate with dmg = nickel.","speed":1,"credit":{"artist":"Leiem","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Analysis_of_nickel(II)_using_dimethylglyoxime.webm"}},{"id":"agcl-nh3","topic":"complex","types":["complexation","solubility"],"title":"Silver chloride + ammonia","nick":"Dissolving a precipitate","color":"#e8ecef","colorName":"silver chloride white","eq":{"l":"AgCl(s) + 2NH3(aq)","r":"[Ag(NH3)2]^+(aq) + Cl^-(aq)"},"see":"The white silver chloride precipitate disappears as ammonia solution is added.","why":"Ammonia binds {Ag^+} as the linear diamminesilver(I) ion (Kf ≈ 1.6 × 10⁷). Removing free {Ag^+} pulls the dissolution equilibrium of AgCl to the right. AgBr needs concentrated ammonia and AgI barely dissolves at all, which is how halide tests are confirmed.","remember":"AgCl dissolves in dilute {NH3}, AgBr only in concentrated, AgI not at all.","speed":1,"credit":{"artist":"Hugo","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Solubility_of_AgCl_in_ammonia_solution.webm"}},{"id":"cuso4-dehyd","topic":"complex","types":["dehydration","hydration"],"title":"Heating blue copper(II) sulfate","nick":"Water as a ligand","color":"#3b8fe0","colorName":"copper sulfate blue","eq":{"l":"CuSO4·5H2O(s)","r":"CuSO4(s) + 5H2O(g)","over":"heat"},"more":[{"label":"Water added back","l":"CuSO4(s) + 5H2O(l)","r":"CuSO4·5H2O(s)"}],"see":"Blue crystals turn white when heated, then blue again when water is added back.","why":"The blue comes from water ligands around {Cu^2+}: they split its d-orbitals so it absorbs orange-red light. Drive the water off and the white anhydrous salt no longer absorbs visible light. Rehydration is exothermic, and white anhydrous {CuSO4} is a standard test for water.","remember":"Blue needs water ligands. White {CuSO4} turning blue = water present.","speed":1.5,"credit":{"artist":"Hugo","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Dehydration_of_Copper_Sulfate_pentahydrate.webm"}},{"id":"cu-nh3","topic":"complex","types":["ligand substitution"],"yt":{"id":"YQs0sFLCRZg","start":0,"end":46,"author":"Wayne Breslyn"},"title":"Copper(II) + ammonia","nick":"Deep blue tetraammine","color":"#2b4fd8","colorName":"tetraamminecopper blue","eq":{"l":"[Cu(H2O)6]^2+(aq) + 4NH3(aq)","r":"[Cu(NH3)4(H2O)2]^2+(aq) + 4H2O(l)"},"more":[{"label":"A little ammonia first gives a pale blue precipitate","l":"Cu^2+(aq) + 2OH^-(aq)","r":"Cu(OH)2(s)"}],"see":"Copper sulfate meeting ammonia solution turns an intense royal blue.","why":"Ammonia is a stronger-field ligand than water, so it replaces four of the waters around Cu²⁺. The new complex absorbs further toward the red end and looks deep blue. A small amount of ammonia only supplies OH⁻ and precipitates pale blue Cu(OH)₂; excess ammonia dissolves it as the ammine complex.","remember":"Pale blue → pale blue precipitate → deep royal blue in excess NH₃.","credit":{"artist":"Wayne Breslyn","license":"YouTube","page":"https://www.youtube.com/watch?v=YQs0sFLCRZg&t=0s"}},{"id":"nh3-fountain","topic":"gas","types":["acid–base","solubility"],"title":"Ammonia gas + water","nick":"Ammonia fountain","color":"#ff4fa3","colorName":"phenolphthalein pink","eq":{"l":"NH3(g) + H2O(l)","a":"\u003c=>","r":"NH4^+(aq) + OH^-(aq)"},"see":"Water squirts up into the flask of ammonia and turns pink.","why":"Ammonia is extremely soluble in water (about 700 volumes per volume at 20 °C) because it hydrogen-bonds with water. The first drops dissolve so much gas that the pressure in the flask collapses, and the air outside pushes water up as a fountain. Phenolphthalein turns pink because ammonia is a weak base.","remember":"Huge solubility → pressure drop → fountain. Pink = base.","speed":1,"credit":{"artist":"Martin.Zapletal","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Ammonia_Fountain.webm"}},{"id":"nh4cl","topic":"gas","types":["acid–base","synthesis"],"title":"Ammonia + hydrogen chloride gas","nick":"White smoke","color":"#e8ecef","colorName":"ammonium chloride white","eq":{"l":"NH3(g) + HCl(g)","r":"NH4Cl(s)"},"see":"Two invisible gas streams meet and make thick white smoke.","why":"Ammonia's lone pair takes a proton from HCl: a Brønsted acid–base reaction with no water involved. The product is ionic, so it appears as a fine solid. In the classic tube version, the ring forms nearer the HCl end because lighter {NH3} (17 g/mol) diffuses faster than HCl (36.5 g/mol), as Graham's law predicts.","remember":"Gas + gas → white solid. The ring forms nearer the HCl end (Graham's law).","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:08._%D0%94%D0%B8%D1%80%D0%B5%D0%BA%D1%82%D0%BD%D0%B0_%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B0_%D0%BD%D0%B0_%D0%B0%D0%BC%D0%BE%D0%BD%D0%B8%D1%83%D0%BC_%D1%85%D0%BB%D0%BE%D1%80%D0%B8%D0%B4.webm"}},{"id":"cac2-water","topic":"gas","types":["acid–base","gas evolution"],"title":"Calcium carbide + water","nick":"Acetylene on demand","color":"#c9d3d6","colorName":"lime white","eq":{"l":"CaC2(s) + 2H2O(l)","r":"Ca(OH)2(aq) + C2H2(g)"},"see":"The grey lumps fizz in water, and the acetylene they release burns with a smoky yellow flame when lit.","why":"Calcium carbide is ionic: {Ca^2+} and the acetylide ion {C2^2-}. Acetylide is the conjugate base of ethyne (pKa ≈ 25), so water protonates it instantly. Miners once used this reaction in carbide lamps.","remember":"{C2^2-} + water → ethyne. A strong base grabbing protons from water.","speed":1,"credit":{"artist":"Alan Kuehner","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Calcium_carbide_and_water.webm"}},{"id":"co2-limewater","topic":"gas","types":["acid–base","precipitation"],"title":"Carbon dioxide + limewater","nick":"The CO₂ test","color":"#e9eef0","colorName":"milky white","eq":{"l":"Ca(OH)2(aq) + CO2(g)","r":"CaCO3(s) + H2O(l)"},"more":[{"label":"CO₂ from the Kipp generator","l":"CaCO3(s) + 2HCl(aq)","r":"CaCl2(aq) + CO2(g) + H2O(l)"},{"label":"Excess CO₂ clears it","l":"CaCO3(s) + CO2(g) + H2O(l)","r":"Ca(HCO3)2(aq)"}],"see":"Gas from the Kipp generator bubbles through clear limewater in the small tube, which turns milky.","why":"{CO2} is an acidic oxide, so it reacts with the base. Calcium carbonate is insoluble, so the solution clouds. Keep bubbling and the carbonate turns into soluble calcium hydrogencarbonate, the same chemistry that carves limestone caves.","remember":"Milky = {CaCO3}. Too much {CO2} clears it again.","speed":1,"credit":{"artist":"Карас Студио","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:24._%D0%88%D0%B0%D0%B3%D0%BB%D0%B5%D1%80%D0%BE%D0%B4_%D0%B4%D0%B8%D0%BE%D0%BA%D1%81%D0%B8%D0%B4_%D1%81%D0%BE_%D0%B2%D0%B0%D1%80%D0%BE%D0%B2%D0%B0_%D0%B2%D0%BE%D0%B4%D0%B0.ogv"}},{"id":"ostwald","topic":"gas","types":["redox","catalysis"],"title":"Ammonia + air over hot platinum","nick":"Ostwald process","color":"#ff6a3d","colorName":"glowing platinum","eq":{"l":"4NH3(g) + 5O2(g)","r":"4NO(g) + 6H2O(g)","over":"Pt"},"more":[{"label":"With excess air","l":"2NO(g) + O2(g)","r":"2NO2(g)"},{"label":"In industry","l":"4NO2(g) + O2(g) + 2H2O(l)","r":"4HNO3(aq)"}],"see":"The platinum foil keeps glowing orange on its own, and the liquid in the U-tube turns dark blue.","why":"The oxidation on the platinum surface is exothermic enough to keep the catalyst red-hot without a burner. The {NO2} formed is a strong oxidizer and turns the diphenylamine test solution blue. This is the first step in making nitric acid industrially.","remember":"{NH3} → NO → {NO2} → {HNO3}. Glowing Pt = exothermic catalysis.","speed":1,"credit":{"artist":"Карас Студио","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:34._%D0%9A%D0%B0%D1%82%D0%B0%D0%BB%D0%B8%D1%82%D0%B8%D1%87%D0%BA%D0%B0_%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D1%86%D0%B8%D1%98%D0%B0_%D0%BD%D0%B0_%D0%B0%D0%BC%D0%BE%D0%BD%D0%B8%D1%98%D0%B0%D0%BA.ogv"}},{"id":"al-amphoteric","topic":"gas","types":["amphoterism","gas evolution"],"yt":{"id":"HJJ5kC_SlfQ","start":3,"end":34,"author":"Periodic Videos"},"title":"Aluminium cans + {NaOH} and {HCl}","nick":"Amphoteric aluminium","color":"#c9d3d6","colorName":"aluminium grey","eq":{"l":"2Al(s) + 2NaOH(aq) + 6H2O(l)","r":"2Na[Al(OH)4](aq) + 3H2(g)"},"more":[{"label":"In acid","l":"2Al(s) + 6HCl(aq)","r":"2AlCl3(aq) + 3H2(g)"}],"see":"Aluminium drink cans sitting in sodium hydroxide and in hydrochloric acid both fizz and crumple as the metal is eaten away.","why":"Aluminium and its oxide are amphoteric: they react with acids to give Al³⁺ and with strong bases to give aluminate, [Al(OH)₄]⁻. Either way, once the protective oxide is dissolved, the metal reduces water or H⁺ to hydrogen. The plastic lining inside a can is untouched.","remember":"Al dissolves in acid and in strong base. Amphoteric.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=HJJ5kC_SlfQ&t=3s"}},{"id":"pbno3-heat","topic":"gas","types":["decomposition"],"yt":{"id":"YOMwFRJBy3U","start":6,"end":52,"author":"Make Me Scientific"},"title":"Heating lead(II) nitrate","nick":"White solid, brown gas","color":"#b5602d","colorName":"nitrogen dioxide brown","eq":{"l":"2Pb(NO3)2(s)","r":"2PbO(s) + 4NO2(g) + O2(g)","over":"heat"},"see":"The white crystals crackle as they are heated, brown gas fills the tube, and a glowing splint relights.","why":"Most metal nitrates decompose on heating to the metal oxide, brown NO₂ and oxygen. Group 1 nitrates (except lithium) are more stable and only lose oxygen to form nitrites (2NaNO₃ → 2NaNO₂ + O₂). The crackling is decrepitation: trapped water bursting the crystals.","remember":"Heavy-metal nitrate → oxide + brown NO₂ + O₂. Group 1 nitrate → nitrite + O₂.","credit":{"artist":"Make Me Scientific","license":"YouTube","page":"https://www.youtube.com/watch?v=YOMwFRJBy3U&t=6s"}},{"id":"chromate-b","topic":"equil","types":["equilibrium","acid–base"],"title":"Chromate ⇌ dichromate","nick":"Le Chatelier with acid and base","color":"#f07f1f","colorName":"dichromate orange","eq":{"l":"2CrO4^2-(aq) + 2H^+(aq)","a":"\u003c=>","r":"Cr2O7^2-(aq) + H2O(l)"},"see":"Yellow chromate turns orange with acid and back to yellow with base. Then barium ions pull the equilibrium by precipitating yellow {BaCrO4}.","why":"Adding {H^+} pushes the equilibrium right, to orange dichromate. Adding {OH^-} removes {H^+} and pulls it back to yellow chromate. Chromium is +6 on both sides, so this is an acid–base condensation, not a redox change.","remember":"Yellow chromate in base, orange dichromate in acid. Both Cr(+6).","speed":2.5,"credit":{"artist":"NCSSMDistanceEd","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Concentration_Effect_on_Chemical_Equilibrium_(chromate_and_dichromate).webm"}},{"id":"no2","topic":"equil","types":["equilibrium","thermodynamics"],"title":"{NO2} ⇌ {N2O4}, hot and cold","nick":"Temperature shifts K","color":"#b5602d","colorName":"nitrogen dioxide brown","eq":{"l":"2NO2(g)","a":"\u003c=>","r":"N2O4(g)"},"see":"A sealed tube of brown gas goes nearly colourless in ice water and deep red-brown in hot water.","why":"Joining two {NO2} radicals forms an N–N bond, so dimerization is exothermic (ΔH ≈ −57 kJ/mol). Heating favours the endothermic direction, back to brown {NO2}; cooling favours colourless {N2O4}. Unlike concentration or pressure changes, a temperature change alters the value of K itself.","remember":"Hot = brown {NO2}. Cold = colourless {N2O4}. Only temperature changes K.","speed":1.25,"credit":{"artist":"NCSSMDistanceEd","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Temperature_Effect_on_Chemical_Equilibrium_(NO_and_NO2).webm"}},{"id":"briggs","topic":"equil","types":["kinetics","oscillating"],"title":"Iodate + {H2O2} + malonic acid + {Mn^2+}","nick":"Briggs–Rauscher oscillator","color":"#d18b1f","colorName":"iodine amber","eq":{"l":"IO3^-(aq) + 2H2O2(aq) + CH2(CO2H)2(aq) + H^+(aq)","r":"ICH(CO2H)2(aq) + 2O2(g) + 3H2O(l)"},"see":"Colourless → amber → blue-black, over and over.","why":"Two pathways take turns. A slow one builds up iodine (amber); once enough iodide accumulates, starch and triiodide give blue-black; then a fast radical pathway catalysed by {Mn^2+} takes over and the cycle resets. It keeps oscillating until the malonic acid or iodate runs low. Only a system far from equilibrium can oscillate like this.","remember":"Amber = {I2}. Blue-black = starch–{I3^-}. Mn²⁺ catalyses the reset.","speed":1,"credit":{"artist":"Maxim Bilovitskiy","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Briggs%E2%80%93Rauscher_reaction.webm"}},{"id":"landolt","topic":"equil","types":["kinetics","clock reaction"],"title":"Iodate + bisulfite, with and without starch","nick":"Iodine clock","color":"#4a62d8","colorName":"starch–iodine blue","eq":{"l":"IO3^-(aq) + 3HSO3^-(aq)","r":"I^-(aq) + 3SO4^2-(aq) + 3H^+(aq)"},"more":[{"label":"Iodide meets iodate","l":"IO3^-(aq) + 5I^-(aq) + 6H^+(aq)","r":"3I2(aq) + 3H2O(l)"},{"label":"Bisulfite removes iodine instantly","l":"I2(aq) + HSO3^-(aq) + H2O(l)","r":"2I^-(aq) + SO4^2-(aq) + 3H^+(aq)"}],"see":"The clear \"cola\" suddenly turns black (with starch); the clear \"beer\" turns golden brown (without starch).","why":"As long as bisulfite remains, any iodine formed is immediately turned back into iodide. The moment the bisulfite runs out, iodine builds up all at once. With starch, it shows as the blue-black starch–triiodide complex; without starch, only the yellow-brown of iodine. The delay depends on concentrations and temperature, which makes it a classic rate experiment.","remember":"Clock time = time to use up the bisulfite. Starch makes the switch dramatic.","speed":1.5,"credit":{"artist":"Дени Ингилизовски","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:87._%D0%A0%D0%B5%D0%B4%D1%83%D0%BA%D1%86%D0%B8%D1%98%D0%B0_%D0%BD%D0%B0_%D1%98%D0%BE%D0%B4%D0%B0%D1%82_%D1%81%D0%BE_%D0%B4%D0%B8%D1%81%D1%83%D0%BB%D1%84%D0%B8%D1%82_%D1%81%D0%BE_%D0%BF%D1%80%D0%B8%D1%81%D1%83%D1%81%D1%82%D0%B2%D0%BE_%D0%B8_%D0%BE%D1%82%D1%81%D1%83%D1%81%D1%82%D0%B2%D0%BE_%D0%BD%D0%B0_%D1%81%D0%BA%D1%80%D0%BE%D0%B1_%D0%BA%D0%B0%D0%BA%D0%BE_%D0%BF%D0%BE%D0%BA%D0%B0%D0%B7%D0%B0%D1%82%D0%B5%D0%BB.ogg"}},{"id":"cocl2","topic":"equil","types":["equilibrium","complexes"],"yt":{"id":"WFdjJ_aS234","start":0,"end":50,"author":"Tommy Technetium"},"title":"Cobalt(II) chloride, hot and cold","nick":"Pink ⇌ blue","color":"#4a5fe0","colorName":"tetrachlorocobaltate blue","eq":{"l":"[Co(H2O)6]^2+(aq) + 4Cl^-(aq)","a":"\u003c=>","r":"[CoCl4]^2-(aq) + 6H2O(l)"},"see":"The cobalt solution turns blue when heated and pink when cooled.","why":"The forward reaction is endothermic, so heating shifts it toward the blue tetrachlorocobaltate ion and cooling shifts it back to the pink hexaaqua ion. The shape changes too: pink [Co(H₂O)₆]²⁺ is octahedral, while blue [CoCl₄]²⁻ is tetrahedral and absorbs much more strongly. Adding chloride also turns it blue; adding water turns it pink.","remember":"Hot / more Cl⁻ → blue tetrahedral. Cold / more water → pink octahedral.","credit":{"artist":"Tommy Technetium","license":"YouTube","page":"https://www.youtube.com/watch?v=WFdjJ_aS234&t=0s"}},{"id":"endothermic","topic":"equil","types":["thermodynamics","entropy"],"yt":{"id":"MyAzjSdc3Fc","start":4,"end":50,"author":"ThirstForScience"},"title":"Barium hydroxide + ammonium thiocyanate","nick":"Freezes to the board","color":"#bfe3f2","colorName":"frost white","eq":{"l":"Ba(OH)2·8H2O(s) + 2NH4SCN(s)","r":"Ba(SCN)2(aq) + 2NH3(g) + 10H2O(l)"},"see":"Two dry solids stirred together turn to slush and get so cold the beaker freezes to a wet board.","why":"The reaction absorbs heat (ΔH > 0) yet happens on its own. Two ordered crystalline solids become a solution, a gas and lots of free water molecules, a large increase in entropy. Since ΔG = ΔH − TΔS, the big positive ΔS makes ΔG negative. You can smell the ammonia.","remember":"Spontaneous but endothermic: entropy wins.","credit":{"artist":"ThirstForScience","license":"YouTube","page":"https://www.youtube.com/watch?v=MyAzjSdc3Fc&t=4s"}}],"media":"/assets/fume-hood/","home":"/"};

const LS = {

};

};
const remote = { ref: null, writing: false, again: false };

// ── formula formatting: Cu^2+ → Cu²⁺, H2O → H₂O, (aq) → small state symbol
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmt(src) {
  let s = esc(src);
  const sups = [];
  s = s.replace(/\^([0-9]*[+-])/g, (_, c) => { sups.push(c.replace('-', '−')); return '\u0001' + (sups.length - 1) + '\u0002'; });
  s = s.replace(/([A-Za-z)\]])(\d+)/g, '$1<sub>$2</sub>');
  s = s.replace(/\((s|l|g|aq|film)\)/g, '<span class="st">($1)</span>');
  return s.replace(/\u0001(\d+)\u0002/g, (_, i) => '<sup>' + sups[i] + '</sup>');
}
const prose = src => String(src).split(/(\{[^}]+\})/).map(p =>
  p.startsWith('{') && p.endsWith('}') ? '<span class="f">' + fmt(p.slice(1, -1)) + '</span>' : esc(p)).join('');
function eqHtml(e, main) {
  const over = e.over ? '<small>' + fmt(e.over) + '</small>' : '';
  const arrow = '<span class="arr">' + over + '<b>' + (e.a === '<=>' ? '⇌' : '→') + '</b></span>';
  const rhs = '<span class="rhs">' + fmt(e.r) + '</span>';
  return '<span class="lhs">' + fmt(e.l) + '</span>' + arrow + rhs +
    (main ? '<button class="reveal" type="button">Tap to reveal products</button>' : '');
}

};

const MEDIA = DATA.media || '';

function creditHtml(r) {
  const c = r.credit;
  if (r.yt) {
    return 'Video by <a href="' + esc(c.page) + '" target="_blank" rel="noopener">' + esc(c.artist) + '</a> on YouTube' +
      (r.yt.rate ? ', played at ' + r.yt.rate + '×' : '') + '.';
  }
  const lic = c.licenseUrl ? '<a href="' + esc(c.licenseUrl) + '" target="_blank" rel="noopener">' + esc(c.license) + '</a>' : esc(c.license);
  return 'Video by <a href="' + esc(c.page) + '" target="_blank" rel="noopener">' + esc(c.artist) + '</a>, ' + lic +
    ', via Wikimedia Commons; trimmed and re-encoded' + (r.speed && r.speed !== 1 ? ', sped up ' + r.speed + '×' : '') + '.';
}

function stageHtml(r) {
  if (r.yt) {
    return '<div class="stage is-yt"><div class="yt" style="background-image:url(https://i.ytimg.com/vi/' + r.yt.id + '/hqdefault.jpg)"></div></div>';
  }
  const c = r.credit;
  return '<div class="stage">' +
    '<video muted playsinline loop preload="none" poster="' + MEDIA + 'p/' + r.id + '.jpg" data-src="' + MEDIA + 'v/' + r.id + '.mp4"></video>' +
    (r.speed && r.speed !== 1 ? '<span class="badge">' + r.speed + '× speed</span>' : '') +
    '<span class="pause" aria-hidden="true">' + icons.play + '</span>' +
    '<div class="rail">' + markBtns +
      '<button class="rbtn sound" type="button" title="Sound on/off (M)"><i>' + icons.sound + '</i>Sound</button>' +
    '</div>' +
    '<a class="credit" href="' + esc(c.page) + '" target="_blank" rel="noopener">Video: ' + esc(c.artist) + ' · ' + esc(c.license) + '</a>' +
    '<div class="prog"><i></i></div>' +
  '</div>';
}

function shortHtml(r) {
  const pairs = r.pairs ? '<div class="pairs">' + r.pairs.map(([ion, name, col]) =>
    '<div class="pair" style="--c:' + col + '"><span class="ion">' + fmt(ion) + '</span><span class="sw"></span><span class="nm">' + esc(name) + '</span><span class="q">?</span></div>').join('') + '</div>' : '';
  const eq = r.eq ? '<div class="eq">' + eqHtml(r.eq, true) + '</div>' : '';
  const reveal = !r.eq && r.pairs ? '<button class="reveal" type="button">Tap to reveal colours</button>' : '';
  const more = (r.more || []).map(m => '<div class="m"><span class="ml">' + esc(m.label) + '</span>' + eqHtml(m, false) + '</div>').join('');
  const types = r.types.filter(t => t.toLowerCase() !== topicName[r.topic].toLowerCase()).map(esc);
  if (r.yt && r.yt.rate) types.push(r.yt.rate + '× speed');
  const kicker = '<div class="kicker"><span class="tp">' + esc(topicName[r.topic]) + '</span><span>' + types.join(' · ') + '</span></div>';
  return '<section class="short' + (r.yt ? ' yt-short' : '') + '" data-id="' + r.id + '" style="--rx:' + r.color + '" aria-label="' + esc(r.title.replace(/[{}^]/g, '')) + '">' +
    stageHtml(r) +
    '<article class="card">' +
      (r.yt ? '<div class="khead">' + kicker + '<div class="crail">' + markBtns + '</div></div>' : kicker) +
      '<h2 class="title">' + prose(r.title) + '</h2>' +
      '<p class="nick">' + prose(r.nick) + '</p>' +
      eq + pairs + reveal +
      '<p class="see"><span class="lbl">Watch for</span>' + prose(r.see) + '</p>' +
      '<p class="locked">Reveal the products to unlock the explanation.</p>' +
      '<button class="ntoggle" type="button" aria-expanded="false">Why it happens ' + icons.chev + '</button>' +
      '<div class="notes">' +
        (more ? '<div class="more">' + more + '</div>' : '') +
        '<p class="why"><span class="lbl">Why it happens</span>' + prose(r.why) + '</p>' +
        '<p class="mem"><span class="lbl">Remember</span>' + prose(r.remember) + '</p>' +
        '<p class="src">Signature colour: ' + prose(r.colorName) + '. ' + creditHtml(r) + '</p>' +
      '</div>' +
    '</article>' +
  '</section>';
}

// ── feed
let sections = [];
let active = null;
const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) setActive(e.target);
}, { root: feed, threshold: 0.6 });

function listFor(topic) {
  let ids = state.shuffle && state.order ? state.order : R.map(r => r.id);
  if (topic === 'review') return ids.filter(id => state.marks[id] === 'review');
  if (topic !== 'all') return ids.filter(id => byId[id].topic === topic);
  return ids;
}

// ── YouTube embeds: one official player per nearby short, privacy-enhanced host, nothing drawn over it
const yt = { players: new Map(), api: null, timer: 0 };
function ytApi() {
  if (!yt.api) yt.api = new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(window.YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return yt.api;
}
async function mountYt(sec) {
  if (yt.players.has(sec)) return yt.players.get(sec);
  const r = byId[sec.dataset.id];
  const box = $('.yt', sec);
  const holder = document.createElement('div');
  box.appendChild(holder);
  const entry = { ready: false, player: null };
  yt.players.set(sec, entry);
  const YT = await ytApi();
  if (yt.players.get(sec) !== entry) return entry;
  entry.player = new YT.Player(holder, {
    host: 'https://www.youtube-nocookie.com',
    videoId: r.yt.id,
    playerVars: { start: r.yt.start, end: r.yt.end, mute: 1, playsinline: 1, rel: 0, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: () => { entry.ready = true; if (sec === active) playYt(sec); },
      onStateChange: e => { if (e.data === 0 && sec === active) { entry.player.seekTo(r.yt.start, true); entry.player.playVideo(); } },
      onError: () => {
        box.innerHTML = '<a class="ytfail" href="https://www.youtube.com/watch?v=' + r.yt.id + '&t=' + r.yt.start + 's" target="_blank" rel="noopener">This video can\'t play here. Watch it on YouTube</a>';
      },
    },
  });
  return entry;
}
function unmountYt(sec) {
  const e = yt.players.get(sec);
  if (!e) return;
  yt.players.delete(sec);
  try { if (e.player) e.player.destroy(); } catch {}
  const box = $('.yt', sec);
  if (box) box.innerHTML = '';
}
function playYt(sec) {
  const e = yt.players.get(sec);
  if (!e || !e.ready) return;
  const p = e.player, r = byId[sec.dataset.id];
  if (state.muted) p.mute(); else p.unMute();
  if (r.yt.rate) p.setPlaybackRate(r.yt.rate);
  p.playVideo();
  // loop the reaction segment: `end` only applies to the first pass
  clearInterval(yt.timer);
  yt.timer = setInterval(() => {
    if (sec !== active || !e.ready) return clearInterval(yt.timer);
    const t = p.getCurrentTime();
    if (t >= r.yt.end - 0.25) { p.seekTo(r.yt.start, true); p.playVideo(); }
  }, 300);
}
function pauseYt(sec) {
  const e = yt.players.get(sec);
  if (e && e.ready) e.player.pauseVideo();
}

function pauseShort(sec) {
  if (!sec) return;
  const v = $('video', sec);
  if (v) v.pause(); else pauseYt(sec);
}

function render(scrollToId) {
  io.disconnect();
  pauseShort(active);
  for (const s of [...yt.players.keys()]) unmountYt(s);
  active = null;
  const ids = listFor(state.topic);
  const label = state.topic === 'all' ? 'all reactions' : state.topic === 'review' ? 'your review pile' : topicName[state.topic];
  let html = ids.map(id => shortHtml(byId[id])).join('');
  if (!ids.length) {
    html = '<section class="short end"><h2>Review pile is empty</h2><p>Tap <b>Review</b> on any reaction you keep forgetting and it will collect here.</p><div class="row"><button class="tbtn" type="button" data-go="all">Browse all reactions</button></div></section>';
  } else {
    html += '<section class="short end"><h2>End of ' + esc(label) + '</h2><p>' + ids.length + ' reaction' + (ids.length > 1 ? 's' : '') + '. <span class="sync">' + syncNote() + '</span></p>' +
      '<div class="row"><button class="tbtn" type="button" data-act="again">Shuffle and go again</button>' +
      (state.topic !== 'review' ? '<button class="tbtn" type="button" data-go="review">Review pile</button>' : '') +
      (state.topic !== 'all' ? '<button class="tbtn" type="button" data-go="all">All reactions</button>' : '') + '</div>' +
      '<p class="keys"><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Space</kbd> pause · <kbd>R</kbd> reveal · <kbd>G</kbd> got it · <kbd>V</kbd> review · <kbd>M</kbd> sound · <kbd>N</kbd> notes</p>' +
      '<p class="keys">Wikimedia Commons clips are trimmed and re-encoded and keep their original licences' +
      (R.some(r => r.yt) ? '; YouTube videos play from their creators\' channels' : '') + '. Credits are under "Why it happens" on each reaction.</p></section>';
  }
  feed.innerHTML = html;
  sections = [...feed.querySelectorAll('.short')];
  for (const s of sections) {
    io.observe(s);
    if (s.dataset.id) paintMarks(s);
    const v = $('video', s);
    if (!v) continue;
    const bar = $('.prog i', s);
    v.addEventListener('timeupdate', () => { if (v.duration) bar.style.transform = 'scaleX(' + (v.currentTime / v.duration) + ')'; });
  }
  renderChips();
  const target = scrollToId && feed.querySelector('[data-id="' + scrollToId + '"]');
  feed.scrollTop = target ? target.offsetTop : 0;
  updateCount();
}

function syncNote() {
  return state.synced ? 'Your marks sync to your account.' : 'Your marks are saved in this browser.';
}

function setActive(sec) {
  if (active === sec) return;
  if (active) {
    pauseShort(active);
    active.classList.remove('paused');
  }
  active = sec;
  const idx = sections.indexOf(sec);
  sections.forEach((s, j) => {
    const d = j - idx;
    const v = $('video', s);
    if (v) { if (d >= -1 && d <= 2) loadVideo(v); else if (Math.abs(d) > 4) unloadVideo(v); }
    else if (s.classList.contains('yt-short')) { if (d >= -1 && d <= 1) mountYt(s); else if (Math.abs(d) > 2) unmountYt(s); }
  });
  playActive();
  updateCount();
  if (sec.dataset.id && state.topic === 'all') LS.set('last', sec.dataset.id);
}
function loadVideo(v) { if (!v.getAttribute('src')) { v.src = v.dataset.src; v.preload = 'auto'; } }
function unloadVideo(v) { if (v.getAttribute('src')) { v.pause(); v.removeAttribute('src'); v.preload = 'none'; v.load(); } }
function playActive() {
  if (!active) return;
  if (active.classList.contains('yt-short')) { const sec = active; mountYt(sec).then(() => playYt(sec)); return; }
  const v = $('video', active);
  if (!v) return;
  loadVideo(v);
  v.muted = state.muted;
  const p = v.play();
  if (p && p.then) p.then(() => active && active.classList.remove('paused')).catch(() => active && active.classList.add('paused'));
}
function togglePlay(sec) {
  const e = yt.players.get(sec);
  if (e && e.ready) {
    if (e.player.getPlayerState() === 1) e.player.pauseVideo(); else playYt(sec);
    return;
  }
  const v = $('video', sec);
  if (!v) return;
  if (v.paused) { sec.classList.remove('paused'); v.muted = state.muted; v.play().catch(() => sec.classList.add('paused')); }
  else { v.pause(); sec.classList.add('paused'); }
}
function step(dir) {
  const idx = active ? sections.indexOf(active) : 0;
  const t = sections[Math.max(0, Math.min(sections.length - 1, idx + dir))];
  if (t) t.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
}
function updateCount() {
  const n = sections.filter(s => s.dataset.id).length;
  const i = active && active.dataset.id ? sections.indexOf(active) + 1 : (active ? n : (n ? 1 : 0));
  $('#count').textContent = n ? i + ' / ' + n : '0 / 0';
}

// ── marks
function paintMarks(sec) {
  const m = state.marks[sec.dataset.id];
  $('.rbtn.known', sec).setAttribute('aria-pressed', m === 'known');
  $('.rbtn.review', sec).setAttribute('aria-pressed', m === 'review');
}
function tally() {
  const vals = Object.values(state.marks);
  return { known: vals.filter(v => v === 'known').length, review: vals.filter(v => v === 'review').length };
}
function renderChips() {
  const t = tally();
  const counts = {};
  for (const r of R) counts[r.topic] = (counts[r.topic] || 0) + 1;
  const chip = (key, label, n, cls = '') => '<button class="chip ' + cls + '" type="button" data-topic="' + key + '" aria-pressed="' + (state.topic === key) + '">' + esc(label) + '<b>' + n + '</b></button>';
  $('#chips').innerHTML = chip('all', 'All', R.length) + chip('review', 'Review pile', t.review, 'rev') +
    TOPICS.filter(([k]) => counts[k]).map(([k, label]) => chip(k, label, counts[k])).join('');
  $('#tally').innerHTML = '<span class="k" title="Marked “got it”">✓ ' + t.known + '</span><span class="r" title="In your review pile">↻ ' + t.review + '</span>';
}
function mark(sec, kind) {
  const id = sec && sec.dataset.id;
  if (!id) return;
  state.marks[id] = state.marks[id] === kind ? undefined : kind;
  if (!state.marks[id]) delete state.marks[id];
  paintMarks(sec);
  renderChips();
  saveMarks();
}
function saveMarks() {
  state.marksAt = Date.now();
  LS.set('marks', state.marks);
  LS.set('marksAt', state.marksAt);
  clearTimeout(saveMarks.t);
  saveMarks.t = setTimeout(pushRemote, 700);
}
async function pushRemote() {
  if (!remote.ref) return;
  if (remote.writing) { remote.again = true; return; }
  remote.writing = true;
  try { await remote.ref.set({ marks: state.marks, updatedAt: state.marksAt }); }
  catch (e) { if (e && e.code !== 'unavailable' && e.code !== 'resource_exhausted') { remote.ref = null; state.synced = false; } }
  remote.writing = false;
  if (remote.again) { remote.again = false; pushRemote(); }
}
async function connectStore() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : null;
    remote.ref = ref;
    state.synced = true;
    if (data && (data.updatedAt || 0) > state.marksAt) {
      state.marks = { ...(data.marks || {}) };
      state.marksAt = data.updatedAt;
      LS.set('marks', state.marks);
      LS.set('marksAt', state.marksAt);
      sections.forEach(s => s.dataset.id && paintMarks(s));
      renderChips();
    } else if (Object.keys(state.marks).length && (!data || state.marksAt > (data.updatedAt || 0))) {
      pushRemote();
    }
    const note = feed.querySelector('.sync');
    if (note) note.textContent = syncNote();
  } catch { /* keep browser-only storage */ }
}

// ── controls
function setQuiz(on) {
  state.quiz = on;
  document.body.classList.toggle('quiz', on);
  $('#quizBtn').setAttribute('aria-pressed', on);
  LS.set('quiz', on);
}
function setMuted(m) {
  state.muted = m;
  document.body.classList.toggle('sound-on', !m);
  if (!active) return;
  const v = $('video', active);
  if (v) { v.muted = m; return; }
  const e = yt.players.get(active);
  if (e && e.ready) { if (m) e.player.mute(); else e.player.unMute(); }
}
function shuffled() {
  const a = R.map(r => r.id);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function reveal(sec) {
  if (!sec || !sec.dataset.id) return;
  sec.classList.add('revealed');
}
function toggleNotes(sec) {
  if (!sec || !sec.dataset.id) return;
  const open = sec.classList.toggle('open');
  $('.ntoggle', sec).setAttribute('aria-expanded', open);
}

feed.addEventListener('click', e => {
  const sec = e.target.closest('.short');
  const go = e.target.closest('[data-go]');
  if (go) { state.topic = go.dataset.go; render(); return; }
  if (e.target.closest('[data-act="again"]')) { state.shuffle = true; state.order = shuffled(); $('#shuffleBtn').setAttribute('aria-pressed', true); render(); return; }
  if (!sec) return;
  if (e.target.closest('.reveal')) { reveal(sec); return; }
  if (e.target.closest('.ntoggle')) { toggleNotes(sec); return; }
  if (e.target.closest('.rbtn.known')) { mark(sec, 'known'); return; }
  if (e.target.closest('.rbtn.review')) { mark(sec, 'review'); return; }
  if (e.target.closest('.rbtn.sound')) { setMuted(!state.muted); if (sec === active) playActive(); return; }
  if (e.target.closest('.credit')) return;
  if (e.target.closest('.stage')) togglePlay(sec);
});
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.topic === state.topic) return;
  state.topic = c.dataset.topic;
  render();
});
$('#quizBtn').addEventListener('click', () => setQuiz(!state.quiz));
$('#shuffleBtn').addEventListener('click', () => {
  state.shuffle = !state.shuffle;
  state.order = state.shuffle ? shuffled() : null;
  $('#shuffleBtn').setAttribute('aria-pressed', state.shuffle);
  render();
});
$('#prevBtn').addEventListener('click', () => step(-1));
$('#nextBtn').addEventListener('click', () => step(1));
$('#brand').addEventListener('click', e => { e.preventDefault(); feed.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); });
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowdown' || k === 'j' || k === 'pagedown') { e.preventDefault(); step(1); }
  else if (k === 'arrowup' || k === 'k' || k === 'pageup') { e.preventDefault(); step(-1); }
  else if (k === ' ') { if (e.target.closest && e.target.closest('button, a')) return; e.preventDefault(); if (active) togglePlay(active); }
  else if (k === 'r') reveal(active);
  else if (k === 'g') mark(active, 'known');
  else if (k === 'v') mark(active, 'review');
  else if (k === 'm') { setMuted(!state.muted); playActive(); }
  else if (k === 'n') toggleNotes(active);
});
document.addEventListener('visibilitychange', () => {
  if (!active) return;
  if (document.hidden) pauseShort(active); else if (!active.classList.contains('paused')) playActive();
});

if (DATA.home) { const h = $('#home'); h.href = DATA.home; h.hidden = false; }
setQuiz(state.quiz);
setMuted(true);
const hash = decodeURIComponent(location.hash.slice(1));
render(byId[hash] ? hash : LS.get('last', null));
connectStore();
</script>

</body>
</html>
