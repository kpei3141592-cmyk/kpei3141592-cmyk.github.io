<!DOCTYPE html>
<html lang="en">
<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fume Hood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>
:root {
  /* Layout: one full-height snap feed; each short = black video stage + reagent-label card (side by side from 960px). Single dark look, like peering into a hood. */
  --bg: #0b0e0f;
  --panel: #12181a;
  --panel-2: #192124;
  --line: #273235;
  --fg: #e6ece9;
  --muted: #8d9d9a;
  --known: #7dd39e;
  --review: #f2b24c;
  --rx: #8fd3c8;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --eq: "STIX Two Text", "Cambria Math", Cambria, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body { height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
sub, sup { font-size: 0.68em; line-height: 0; }
sub { vertical-align: -0.28em; }
sup { vertical-align: 0.5em; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ── header */
.top {
  flex: none; position: relative; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { display: flex; align-items: center; gap: 12px; min-width: 0; }
.home {
  display: inline-flex; align-items: center; gap: 2px; flex: none; height: 30px; padding: 0 8px 0 4px; margin-right: -2px;
  border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--muted); font: 500 12px/1 var(--mono);
}
.home svg { width: 16px; height: 16px; }
.home:hover { color: var(--fg); border-color: var(--muted); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; flex: none; }
.brand svg { width: 22px; height: 22px; color: var(--fg); }
.brand span { font: 800 23px/1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
.count { font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally { display: flex; gap: 10px; font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally .k { color: var(--known); }
.tally .r { color: var(--review); }
.tools { margin-left: auto; display: flex; gap: 6px; flex: none; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
}
.tbtn svg { width: 14px; height: 14px; }
.tbtn[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.tbtn:hover { border-color: var(--muted); }
.chips { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  font: 500 13px/1 var(--ui); color: var(--muted); cursor: pointer; white-space: nowrap;
}
.chip b { font: 500 11px/1 var(--mono); margin-left: 5px; opacity: 0.75; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.rev[aria-pressed="false"] b { color: var(--review); opacity: 1; }

/* ── feed */
.feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.short { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; position: relative; }

.stage {
  --glow: color-mix(in oklab, var(--rx) 30%, transparent);
  position: relative; flex: 1 1 auto; min-height: 36%; overflow: hidden; cursor: pointer;
  background-color: #040506;
  background-image: radial-gradient(70% 55% at 50% 52%, var(--glow), transparent 78%);
}
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.badge {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); padding: 4px 8px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.18);
  font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: #f2f5f4;
}
.pause {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.25);
  opacity: 0; transform: scale(0.9); transition: opacity 0.18s, transform 0.18s; pointer-events: none;
}
.pause svg { width: 26px; height: 26px; margin-left: 4px; fill: #fff; }
.short.paused .pause { opacity: 1; transform: none; }
.rail {
  position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 48px;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.rbtn {
  display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer;
  font: 500 11px/1 var(--ui); color: #f2f5f4; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}
.rbtn i {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(20, 26, 28, 0.62); border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: background 0.15s, color 0.15s, transform 0.12s;
}
.rbtn svg { width: 21px; height: 21px; }
.rbtn:active i { transform: scale(0.92); }
.rbtn.known[aria-pressed="true"] i { background: var(--known); color: #0b1a10; border-color: var(--known); }
.rbtn.review[aria-pressed="true"] i { background: var(--review); color: #241703; border-color: var(--review); }
.rbtn.sound .on { display: none; }
body.sound-on .rbtn.sound .on { display: block; }
body.sound-on .rbtn.sound .off { display: none; }
.credit {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 13px; max-width: calc(100% - 90px);
  font: 500 10.5px/1.3 var(--mono); color: rgba(240, 244, 243, 0.78); text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}
.credit:hover { color: #fff; text-decoration: underline; }
.stage.is-yt { cursor: default; }
.yt { position: absolute; inset: 0; background: #000 center / contain no-repeat; }
.yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.ytfail {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%; padding: 10px 14px; border-radius: 10px;
  background: rgba(0, 0, 0, 0.75); color: #fff; text-align: center; font-size: 14px;
}
.khead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.crail { display: flex; gap: 6px; flex: none; }
.crail .rbtn {
  flex-direction: row; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--fg); text-shadow: none; font-size: 12.5px;
}
.crail .rbtn i { width: 26px; height: 26px; background: transparent; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; }
.crail .rbtn svg { width: 16px; height: 16px; }
.crail .rbtn.known[aria-pressed="true"] { border-color: var(--known); }
.crail .rbtn.review[aria-pressed="true"] { border-color: var(--review); }
.crail .rbtn.known[aria-pressed="true"] i { background: var(--known); }
.crail .rbtn.review[aria-pressed="true"] i { background: var(--review); }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.12); }
.prog i { display: block; height: 100%; background: var(--rx); transform-origin: left; transform: scaleX(0); }

/* ── card */
.card {
  flex: 0 1 auto; max-height: 64%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-top: 2px solid var(--rx);
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 9px;
}
.kicker { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 500 10.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.kicker .tp { color: color-mix(in oklab, var(--rx) 62%, #ffffff); }
.title { margin: 0; font: 800 29px/0.98 var(--display); text-transform: uppercase; letter-spacing: 0.015em; text-wrap: balance; }
.nick { margin: -4px 0 0; font-style: italic; color: var(--muted); font-size: 14px; }
.eq {
  font: 400 20px/1.55 var(--eq); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; overflow-x: auto; overflow-y: hidden; min-width: 0;
}
.st { font-size: 0.6em; color: var(--muted); font-family: var(--ui); margin-left: 0.08em; vertical-align: 0.05em; }
.arr { display: inline-flex; flex-direction: column; align-items: center; margin: 0 0.35em; vertical-align: middle; line-height: 1; }
.arr small { font: 400 11px/1 var(--ui); color: var(--muted); margin-bottom: 1px; }
.arr b { font-weight: 400; color: color-mix(in oklab, var(--rx) 55%, #ffffff); }
.reveal {
  display: none; cursor: pointer; vertical-align: middle; margin: 2px 0; padding: 5px 11px; border-radius: 999px;
  background: transparent; border: 1.5px dashed color-mix(in oklab, var(--rx) 70%, #ffffff); color: var(--fg);
  font: 500 13px/1.2 var(--ui);
}
body.quiz .short:not(.revealed) .rhs { display: none; }
body.quiz .short:not(.revealed) .reveal { display: inline-block; }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }
.pair { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
.pair .ion { font: 400 18px/1 var(--eq); min-width: 2.4em; }
.pair .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 10px var(--c); }
.pair .nm { font-size: 13px; color: var(--fg); }
.pair .q { display: none; font: 500 12px/1 var(--mono); color: var(--muted); }
body.quiz .short:not(.revealed) .pair .sw, body.quiz .short:not(.revealed) .pair .nm { display: none; }
body.quiz .short:not(.revealed) .pair .q { display: inline; }
.lbl { display: block; font: 500 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 2px; }
.see { margin: 0; font-size: 14.5px; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.notes p { margin: 0; }
.why { font-size: 14.5px; color: #cdd6d3; max-width: 62ch; }
.mem { font-size: 15px; font-weight: 500; padding-top: 9px; border-top: 1px dotted var(--line); }
.mem .lbl { color: color-mix(in oklab, var(--rx) 62%, #ffffff); }
.more { display: flex; flex-direction: column; gap: 7px; }
.more .m { font: 400 16.5px/1.5 var(--eq); overflow-x: auto; overflow-y: hidden; }
.more .m .ml { display: block; font: 500 11.5px/1.3 var(--ui); color: var(--muted); }
.src { font-size: 12px; color: var(--muted); }
.src a { color: var(--fg); }
.f { white-space: nowrap; font-family: var(--eq); font-size: 1.06em; }
.title .f, .nick .f { font-family: inherit; font-size: inherit; text-transform: none; }
.ntoggle {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; background: none; border: 0; cursor: pointer;
  font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg);
}
.ntoggle svg { width: 12px; height: 12px; transition: transform 0.15s; }
.short.open .ntoggle svg { transform: rotate(180deg); }
.locked { display: none; font-size: 13px; color: var(--muted); font-style: italic; }
body.quiz .short:not(.revealed) .notes, body.quiz .short:not(.revealed) .ntoggle { display: none; }
body.quiz .short:not(.revealed) .locked { display: block; }

@media (max-width: 959px) {
  .notes { display: none; }
  .short.open .notes { display: flex; }
  body.quiz .short:not(.revealed).open .notes { display: none; }
}

/* end / empty cards */
.short.end { align-items: center; justify-content: center; text-align: center; padding-inline: max(24px, env(safe-area-inset-left, 0px)); gap: 14px; }
.end h2 { margin: 0; font: 800 40px/0.95 var(--display); text-transform: uppercase; text-wrap: balance; }
.end p { margin: 0; color: var(--muted); max-width: 44ch; }
.end .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.end .tbtn { height: 36px; padding: 0 14px; }
.keys { font: 500 11px/1.8 var(--mono); color: var(--muted); }
.keys kbd { font: inherit; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--fg); }

/* desktop arrows */
.arrows { display: none; }

@media (min-width: 960px) {
  .short:not(.end) {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 400px); gap: 20px;
    padding-block: 18px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(84px, env(safe-area-inset-right, 0px));
    max-width: 1320px; margin-inline: auto;
  }
  .stage { min-height: 0; border-radius: 16px; }
  .card { max-height: none; border: 1px solid var(--line); border-top: 3px solid var(--rx); border-radius: 16px; padding: 18px 20px; gap: 11px; }
  .title { font-size: 38px; }
  .eq { font-size: 22px; }
  .ntoggle { display: none !important; }
  .arrows {
    display: flex; flex-direction: column; gap: 10px; position: fixed; z-index: 6; top: 50%; transform: translateY(-50%);
    right: max(18px, env(safe-area-inset-right, 0px));
  }
  .arrows button {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer;
    display: grid; place-items: center;
  }
  .arrows button:hover { border-color: var(--muted); }
  .arrows svg { width: 20px; height: 20px; }
}
@media (max-width: 420px) {
  .tally { display: none; }
  .title { font-size: 26px; }
  .eq { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .pause, .rbtn i, .ntoggle svg { transition: none; }
}
</style>

</head>

<script>
const DATA = {"topics":[["sblock","s-Block"],["redox","Redox"],["fire","Fire & Synthesis"],["oxygen","Peroxides & O₂"],["precip","Precipitation"],["complex","Complexes & Color"],["gas","Acids, Bases & Gases"],["equil","Equilibria & Clocks"]],"reactions":[{"id":"li-water","topic":"sblock","types":["redox","gas evolution"],"title":"Lithium + water","nick":"The slow one in group 1","color":"#e0314b","colorName":"lithium crimson","eq":{"l":"2Li(s) + 2H2O(l)","r":"2LiOH(aq) + H2(g)"},"more":[{"label":"The gas is lit at the mouth of the tube","l":"2H2(g) + O2(g)","r":"2H2O(g)"}],"see":"Steady fizzing in the tube. The gas pops when lit, with a crimson tinge from lithium.","why":"Lithium has the most negative standard potential in group 1 ({Li^+}/Li, E° = −3.04 V), yet it reacts the most gently. Thermodynamics tells you how far a reaction goes, not how fast. Lithium stays solid (mp 180 °C), so its surface area stays small, and it has the highest ionization energy in the group.","remember":"Li is the strongest reductant on paper and the slowest in water. Kinetics, not thermodynamics.","speed":1,"credit":{"artist":"Карас Студио","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:35._%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%98%D0%B0_%D0%BD%D0%B0_%D0%BB%D0%B8%D1%82%D0%B8%D1%83%D0%BC_%D1%81%D0%BE_%D0%B2%D0%BE%D0%B4%D0%B0.ogv"}},{"id":"na-water","topic":"sblock","types":["redox","gas evolution"],"title":"Sodium + water","nick":"With phenolphthalein","color":"#ff4fa3","colorName":"phenolphthalein pink","eq":{"l":"2Na(s) + 2H2O(l)","r":"2NaOH(aq) + H2(g)"},"see":"A molten silver bead skates across the surface and leaves a pink trail behind it.","why":"The reaction gives off enough heat to melt sodium (mp 98 °C) into a ball, and escaping {H2} pushes it around. Phenolphthalein turns pink above pH ≈ 8.2, so the trail marks exactly where {OH^-} is being made.","remember":"Pink trail = {OH^-} forming wherever the sodium has been.","speed":1,"credit":{"artist":"W. Oelen","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","page":"https://commons.wikimedia.org/wiki/File:Sodium_skirting_over_Water_with_few_drops_of_Phenolphthalein_solution_added.webm"}},{"id":"k-water","topic":"sblock","types":["redox","gas evolution"],"title":"Potassium + water","nick":"Lights its own hydrogen","color":"#b48cff","colorName":"potassium lilac","eq":{"l":"2K(s) + 2H2O(l)","r":"2KOH(aq) + H2(g)"},"see":"Each piece bursts into a lilac-pink flame, races around, and finishes with a small pop.","why":"Potassium's outer electron is farther from the nucleus than sodium's, so it's easier to remove (first ionization energy 419 vs 496 kJ/mol). The reaction is faster and hot enough to ignite the hydrogen it releases. Potassium atoms in the flame give the lilac colour.","remember":"K ignites its own {H2}. Lilac flame = potassium.","speed":1,"credit":{"artist":"Maxim Bilovitskiy","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Potassium_metal_in_water.webm"}},{"id":"cs-water","topic":"sblock","types":["redox","gas evolution"],"title":"Caesium + water","nick":"Bottom of group 1","color":"#ffc14d","colorName":"hydrogen flash","eq":{"l":"2Cs(s) + 2H2O(l)","r":"2CsOH(aq) + H2(g)"},"see":"A violent burst the instant the metal touches water, with burning hydrogen.","why":"Caesium has the lowest first ionization energy of any stable element (376 kJ/mol) and melts at 28 °C. It reacts on contact and explosively, and {CsOH} is among the strongest hydroxide bases.","remember":"Reactivity climbs down group 1: Li \u003c Na \u003c K \u003c Rb \u003c Cs.","speed":1,"credit":{"artist":"Philip Evans","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","page":"https://commons.wikimedia.org/wiki/File:Cesium_water.theora.ogv"}},{"id":"ca-water","topic":"sblock","types":["redox","gas evolution"],"title":"Calcium + water","nick":"Group 2 is gentler","color":"#cfd8da","colorName":"milky white","eq":{"l":"Ca(s) + 2H2O(l)","r":"Ca(OH)2(s) + H2(g)"},"see":"The granules bubble steadily and the water turns cloudy white.","why":"Group 2 metals must lose two electrons, so they react more slowly than their group 1 neighbours. The cloudiness is calcium hydroxide, which is only sparingly soluble (about 1.7 g/L at 20 °C). The clear solution above it is limewater.","remember":"Cloudy = {Ca(OH)2} that barely dissolves. Its clear solution is limewater.","speed":1,"credit":{"artist":"François Nguyen","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","page":"https://commons.wikimedia.org/wiki/File:About_1_gram_of_metallic_calcium_reacts_with_warm_water.webm"}},{"id":"na-cl2","topic":"sblock","types":["redox","synthesis"],"title":"Sodium + chlorine","nick":"Making table salt","color":"#ffb52e","colorName":"sodium D-line yellow","eq":{"l":"2Na(s) + Cl2(g)","r":"2NaCl(s)"},"see":"Hot sodium lowered into pale green chlorine glows yellow-orange and gives off white smoke.","why":"Sodium gives up its 3s electron and chlorine accepts it. Ionizing sodium alone costs energy; the payoff is the lattice energy of {NaCl} (about 787 kJ/mol). Overall ΔH_f° = −411 kJ/mol. The yellow glow is sodium's 589 nm emission.","remember":"Toxic metal + toxic gas → table salt. Lattice energy pays the bill (Born–Haber cycle).","speed":1,"credit":{"artist":"ScienceCOLA","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Reaction_between_Sodium_and_Chlorine.webm"}},{"id":"mg-o2","topic":"sblock","types":["redox","combustion"],"title":"Magnesium + oxygen","nick":"Burning in pure {O2}","color":"#eef1ff","colorName":"blinding white","eq":{"l":"2Mg(s) + O2(g)","r":"2MgO(s)"},"see":"A dazzling white flame, much brighter in pure oxygen than in air, leaving white ash.","why":"Forming MgO releases about 601 kJ/mol. The flame is hot enough that MgO particles glow white-hot, and a lot of the light is ultraviolet. Pure {O2} raises the reactant concentration, so the rate jumps.","remember":"White ash = {MgO}, a basic oxide. Never stare at burning magnesium (UV).","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:108._%D0%93%D0%BE%D1%80%D0%B5%D1%9A%D0%B5_%D0%BD%D0%B0_%D0%BC%D0%B0%D0%B3%D0%BD%D0%B5%D0%B7%D0%B8%D1%83%D0%BC_%D0%B2%D0%BE_%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%80%D0%BE%D0%B4.webm"}},{"id":"mg-water","topic":"sblock","types":["redox","combustion"],"title":"Burning magnesium + water","nick":"Fire that water feeds","color":"#eef1ff","colorName":"magnesium white","eq":{"l":"Mg(s) + H2O(g)","r":"MgO(s) + H2(g)"},"see":"Burning magnesium plunged into a flask of water keeps burning brilliantly.","why":"Cold water attacks magnesium only slowly, but burning magnesium is hot enough to strip oxygen from steam, and the hydrogen produced can burn too. That is why water, and even {CO2}, must never be used on a metal fire. Dry sand or a class D extinguisher is used instead.","remember":"Burning Mg takes O from water. Never use water on a metal fire.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:68._%D0%93%D0%BE%D1%80%D0%B5%D1%9A%D0%B5_%D0%BC%D0%B0%D0%B3%D0%BD%D0%B5%D0%B7%D0%B8%D1%83%D0%BC_%D0%BF%D0%BE%D0%B4_%D0%B2%D0%BE%D0%B4%D0%B0.ogg"}},{"id":"flame-tests","topic":"sblock","types":["emission","analysis"],"title":"Metal ions in a flame","nick":"Flame tests","color":"#ff6a3d","colorName":"flame colours","pairs":[["K^+","lilac","#b48cff"],["Ba^2+","pale green","#a6e36a"],["Ca^2+","brick red","#e2552b"],["Sr^2+","scarlet red","#ff2b2b"],["Li^+","crimson red","#d4213d"],["Na^+","yellow-orange","#ffb52e"],["Cu^2+","blue-green","#2fd3b5"]],"see":"A wire dipped in each salt colours the burner flame: K, Ba, Ca, Sr, Li, Na, then Cu.","why":"Heat promotes electrons to higher energy levels. As they fall back, they emit photons whose energies are set by each element's own level spacings, so every metal gives a signature colour. Sodium's 589 nm emission is so strong it masks others; potassium is viewed through cobalt-blue glass to filter it out.","remember":"Li crimson · Na orange · K lilac · Ca brick red · Sr red · Ba green · Cu blue-green.","speed":2,"credit":{"artist":"North Carolina School of Science and Mathematics","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Flame_Tests_of_Metal_Ions,_With_Labels.webm"}},{"id":"rb-water","topic":"sblock","types":["redox","gas evolution"],"yt":{"id":"vcT7qxFGD6s","start":3,"end":30,"author":"Periodic Videos"},"title":"Rubidium + water","nick":"It sinks, then explodes","color":"#ff9a3c","colorName":"hydrogen fireball","eq":{"l":"2Rb(s) + 2H2O(l)","r":"2RbOH(aq) + H2(g)"},"see":"A small piece of rubidium dropped into a tank of water explodes almost at once.","why":"Rubidium loses its 5s electron even more easily than potassium (first ionization energy 403 kJ/mol). It is also denser than water (1.53 g/cm³), so unlike Li, Na and K it sinks and reacts all over its surface at once, releasing hydrogen and heat explosively.","remember":"Li, Na, K float; Rb and Cs sink and explode.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=vcT7qxFGD6s&t=3s"}},{"id":"k-air","topic":"sblock","types":["redox","oxidation"],"yt":{"id":"K-KBrIvRth4","start":9,"end":26,"author":"Royal Society of Chemistry"},"title":"Freshly cut potassium + air","nick":"Tarnishes in seconds","color":"#b48cff","colorName":"potassium lilac","eq":{"l":"4K(s) + O2(g)","r":"2K2O(s)"},"more":[{"label":"With more oxygen, the superoxide forms","l":"K(s) + O2(g)","r":"KO2(s)"}],"see":"The knife reveals a shiny silver surface that dulls over within seconds.","why":"Potassium gives up its outer electron so readily that it reacts with oxygen and moisture in air almost instantly, coating the fresh surface with oxide. That is why group 1 metals are stored under oil. Heavier alkali metals tend to form peroxides and superoxides (Na₂O₂, KO₂) rather than simple oxides.","remember":"Shiny for a moment, dull in seconds. Alkali metals live under oil.","credit":{"artist":"Royal Society of Chemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=K-KBrIvRth4&t=9s"}},{"id":"mg-co2","topic":"sblock","types":["redox","combustion"],"yt":{"id":"NMZT2BAEtnc","start":3,"end":28,"author":"Periodic Videos"},"title":"Burning magnesium + dry ice","nick":"CO₂ can’t put it out","color":"#eef1ff","colorName":"magnesium white","eq":{"l":"2Mg(s) + CO2(s)","r":"2MgO(s) + C(s)"},"see":"Burning magnesium placed inside a block of dry ice keeps blazing, lighting the block from within.","why":"Magnesium binds oxygen more strongly than carbon does: forming 2 MgO releases 1203 kJ, while breaking up one CO₂ costs only 394 kJ, so ΔH ≈ −810 kJ. The white product is MgO and the black specks are carbon. This is why carbon dioxide extinguishers must never be used on metal fires.","remember":"White MgO + black carbon. Mg steals oxygen even from CO₂.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=NMZT2BAEtnc&t=3s"}},{"id":"na-nh3","topic":"sblock","types":["redox","solvated electrons"],"yt":{"id":"kNC56EljJ7k","start":68,"end":104,"author":"Royal Society of Chemistry"},"title":"Sodium + liquid ammonia","nick":"Electrons in a bottle","color":"#2b3fd8","colorName":"solvated-electron blue","eq":{"l":"Na(s)","r":"Na^+(am) + e^-(am)","over":"NH3(l), −33 °C"},"more":[{"label":"Slow decomposition (faster with an iron catalyst)","l":"2Na(s) + 2NH3(l)","r":"2NaNH2(s) + H2(g)"}],"see":"Sodium dropped into liquid ammonia turns it an inky blue-black.","why":"Sodium ionizes in liquid ammonia, and the freed electron sits in a cavity of ammonia molecules: a solvated electron. It absorbs red and near-infrared light, so the solution looks deep blue. Concentrated solutions turn bronze and conduct electricity like a metal. These electrons are powerful reductants, used in the Birch reduction.","remember":"Blue = solvated electrons. Concentrated = bronze and metallic.","credit":{"artist":"Royal Society of Chemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=kNC56EljJ7k&t=68s"}},{"id":"cu-agno3","topic":"redox","types":["redox","single displacement"],"title":"Copper + silver nitrate","nick":"Silver tree","color":"#3fa7e8","colorName":"copper(II) blue","eq":{"l":"Cu(s) + 2AgNO3(aq)","r":"Cu(NO3)2(aq) + 2Ag(s)"},"more":[{"label":"Net ionic","l":"Cu(s) + 2Ag^+(aq)","r":"Cu^2+(aq) + 2Ag(s)"}],"see":"Close up: feathery, glittering silver crystals spread across the copper. The solution slowly turns blue.","why":"{Ag^+} is a stronger oxidizing agent than {Cu^2+} (E° = +0.80 V vs +0.34 V), so copper hands its electrons to silver ions. E°cell = +0.46 V, which is positive, so the reaction is spontaneous. The blue colour is hydrated {Cu^2+}.","remember":"A metal displaces any metal less reactive than itself. Cu beats Ag.","speed":1,"credit":{"artist":"Bilovitskiy","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Silver.webm"}},{"id":"fe-cuso4","topic":"redox","types":["redox","single displacement"],"title":"Iron + copper(II) sulfate","nick":"Free copper plating","color":"#d9774a","colorName":"copper pink","eq":{"l":"Fe(s) + CuSO4(aq)","r":"FeSO4(aq) + Cu(s)"},"more":[{"label":"Net ionic","l":"Fe(s) + Cu^2+(aq)","r":"Fe^2+(aq) + Cu(s)"}],"see":"Steel wool in blue copper sulfate (sped up) grows a red-brown copper coat while the blue fades.","why":"Iron is more reactive than copper (E° Fe²⁺/Fe = −0.44 V, Cu²⁺/Cu = +0.34 V), so iron reduces copper ions to the metal and dissolves as {Fe^2+}. E°cell = +0.78 V. The blue fades as {Cu^2+} is used up and pale green {Fe^2+} replaces it.","remember":"Blue fades, copper coats the iron. Used historically to recover copper from mine water.","speed":2.5,"credit":{"artist":"Hugo","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Reaction_of_copper_sulfate_with_iron.webm"}},{"id":"metals-hcl","topic":"redox","types":["redox","gas evolution"],"title":"{Cu}, {Fe}, {Zn}, {Mg} + hydrochloric acid","nick":"Activity series in four tubes","color":"#b9c4c7","colorName":"hydrogen bubbles","eq":{"l":"M(s) + 2HCl(aq)","r":"MCl2(aq) + H2(g)"},"more":[{"label":"Magnesium (fastest)","l":"Mg(s) + 2HCl(aq)","r":"MgCl2(aq) + H2(g)"},{"label":"Copper","l":"Cu(s) + HCl(aq)","r":"no reaction"}],"see":"Copper does nothing, iron bubbles slowly, zinc steadily, and magnesium foams furiously.","why":"Only metals with negative standard potentials can reduce {H^+} to {H2}. Copper (+0.34 V) cannot. Among the others, the rate order Mg > Zn > Fe follows how negative their potentials are (−2.37, −0.76 and −0.44 V), though oxide layers and surface area matter too.","remember":"Above hydrogen in the activity series → fizzes in acid. Cu, Ag and Au don't.","speed":2,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:64._%D0%A5%D0%BB%D0%BE%D1%80%D0%BE%D0%B2%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B4%D0%BD%D0%B0_%D0%BA%D0%B8%D1%81%D0%B5%D0%BB%D0%B8%D0%BD%D0%B0_%D1%81%D0%BE_%D1%80%D0%B0%D0%B7%D0%BB%D0%B8%D1%87%D0%BD%D0%B8_%D0%BC%D0%B5%D1%82%D0%B0%D0%BB%D0%B8.ogg"}},{"id":"zn-brass","topic":"redox","types":["redox","amphoterism"],"title":"Copper coin + zinc in hot {NaOH}","nick":"Copper → \"silver\" → \"gold\"","color":"#d4a640","colorName":"brass gold","eq":{"l":"Zn(s) + 2OH^-(aq) + 2H2O(l)","r":"[Zn(OH)4]^2-(aq) + H2(g)"},"more":[{"label":"Zinc plates out on copper touching the zinc","l":"[Zn(OH)4]^2-(aq) + 2e^-","r":"Zn(s) + 4OH^-(aq)"},{"label":"Heated in a flame","l":"Cu + Zn","r":"brass (Cu–Zn alloy)"}],"see":"A copper coin turns silver in hot alkaline zinc, then gold when heated in a flame.","why":"Zinc is amphoteric: it dissolves in hot sodium hydroxide as zincate. Where the coin touches zinc metal, the pair forms a galvanic cell and zinc deposits on the copper surface. Heating lets zinc atoms diffuse into the copper, forming brass, a golden alloy. No real silver or gold is involved.","remember":"Zn is amphoteric: it dissolves in acids and in strong bases (as zincate).","speed":2,"credit":{"artist":"ScienceCOLA","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Zinc-plating_and_the_formation_of_brass_-_turning_Copper_into_%22Silver%22_and_%22Gold%22.webm"}},{"id":"hg-heart","topic":"redox","types":["redox","electrochemistry"],"title":"Mercury + iron nail in acidic oxidant","nick":"Mercury beating heart","color":"#c8cdd2","colorName":"mercury silver","eq":{"l":"2Hg(l) + SO4^2-(aq)","r":"Hg2SO4(film) + 2e^-"},"more":[{"label":"Iron touches the drop and supplies electrons","l":"Fe(s)","r":"Fe^2+(aq) + 2e^-"}],"see":"The blob of mercury pulses: it flattens, touches the nail, snaps back into a rounder drop, and repeats.","why":"Mercury's surface tension depends on the charge on its surface. The oxidant (often dichromate or peroxide in sulfuric acid) builds a mercury(I) film, surface tension drops and the drop spreads until it touches the iron. Iron then feeds in electrons, the film is reduced, surface tension rises, and the drop pulls back and breaks contact. The cycle repeats.","remember":"Oxidize → flatten → touch Fe → reduce → contract. A redox oscillator you can see.","speed":1,"credit":{"artist":"Дени Ингилизовски","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:89._%D0%96%D0%B8%D0%B2%D0%B8%D0%BD%D0%BE_%D1%81%D1%80%D1%86%D0%B5.ogg"}},{"id":"kmno4-chameleon","topic":"redox","types":["redox","oxidation states"],"title":"Permanganate + sugar in base","nick":"Chemical chameleon","color":"#3fbf6a","colorName":"manganate green","eq":{"l":"MnO4^-(aq) + e^-","r":"MnO4^2-(aq)"},"more":[{"label":"Then","l":"MnO4^2-(aq) + 2H2O(l) + 2e^-","r":"MnO2(s) + 4OH^-(aq)"}],"see":"Purple turns blue, then green, then yellow-orange as the sugar works.","why":"In alkaline solution, glucose reduces manganese one stage at a time: purple permanganate (+7) → green manganate (+6) → orange-brown colloidal manganese dioxide (+4). The blue stage is purple and green mixing. In acid, permanganate goes straight to almost colourless {Mn^2+} instead.","remember":"Purple +7 → green +6 → brown +4. In acid: straight to pale pink {Mn^2+}.","speed":1.5,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:59._%D0%9A%D0%B0%D0%BC%D0%B5%D0%BB%D0%B5%D0%BE%D0%BD_%D1%81%D0%BE_%D0%BB%D0%B8%D0%B6%D0%B0%D0%B2%D1%87%D0%B5.ogg"}},{"id":"vanadium","topic":"redox","types":["redox","oxidation states"],"title":"Vanadium(V) + Devarda’s alloy","nick":"Chemical tea","color":"#8a5cff","colorName":"vanadium(II) violet","eq":{"l":"VO2^+(aq) + 2H^+(aq) + e^-","r":"VO^2+(aq) + H2O(l)"},"more":[{"label":"+4 → +3","l":"VO^2+(aq) + 2H^+(aq) + e^-","r":"V^3+(aq) + H2O(l)"},{"label":"+3 → +2","l":"V^3+(aq) + e^-","r":"V^2+(aq)"},{"label":"Electron source (mostly aluminium)","l":"Al(s)","r":"Al^3+(aq) + 3e^-"}],"see":"A \"tea bag\" of reducing alloy steeps in the hot solution, which runs from red-brown through green, blue and teal to violet.","why":"Each colour is a different oxidation state of vanadium. Devarda's alloy (aluminium, copper and a little zinc) is a strong enough reductant (E° Al³⁺/Al = −1.66 V) to take vanadium all the way from +5 to +2. The opening red-brown colour is a vanadium(V) peroxo complex formed with added {H2O2}.","remember":"Yellow +5 · Blue +4 · Green +3 · Violet +2.","speed":1.5,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:125._%D0%A5%D0%B5%D0%BC%D0%B8%D1%81%D0%BA%D0%B8_%D1%87%D0%B0%D1%98_(%D0%BE%D0%BA%D1%81%D0%B8%D0%B4%D0%B0%D1%86%D0%B8%D1%81%D0%BA%D0%B8_%D1%81%D0%BE%D1%81%D1%82%D0%BE%D1%98%D0%B1%D0%B8_%D0%BD%D0%B0_%D0%B2%D0%B0%D0%BD%D0%B0%D0%B4%D0%B8%D1%83%D0%BC%D0%BE%D1%82).webm"}},{"id":"kmno4-glycerol","topic":"redox","types":["redox","combustion"],"title":"Potassium permanganate + glycerol","nick":"Delayed fire","color":"#b03fd6","colorName":"permanganate purple","eq":{"l":"14KMnO4(s) + 4C3H5(OH)3(l)","r":"7K2CO3(s) + 7Mn2O3(s) + 5CO2(g) + 16H2O(g)"},"see":"Glycerol is dripped onto a mound of ground permanganate. Nothing happens for a while, then it smokes and bursts into flame.","why":"Permanganate is a powerful oxidizer and glycerol is the fuel. The reaction begins slowly at the crystal surfaces, but the heat it releases speeds it up, which releases more heat. This feedback, thermal runaway, explains the delay. The violet tint comes from potassium.","remember":"The delay is an induction period: heat speeds the reaction, and the reaction makes more heat.","speed":1,"credit":{"artist":"ScienceCOLA","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Reaction_between_potassium_permanganate_and_glycerol.webm"}},{"id":"mn2o7","topic":"redox","types":["redox","acid anhydride"],"title":"Permanganate + conc. sulfuric acid, then ethanol","nick":"Ignites on contact","color":"#6b8f3a","colorName":"oily dark green","eq":{"l":"2KMnO4(s) + H2SO4(l)","r":"Mn2O7(l) + K2SO4(s) + H2O(l)"},"more":[{"label":"A drop of ethanol","l":"2Mn2O7(l) + C2H5OH(l)","r":"4MnO2(s) + 2CO2(g) + 3H2O(g)"}],"see":"Each drop of ethanol landing on the dark paste bursts into flame.","why":"Concentrated sulfuric acid pulls water out of permanganate, forming {Mn2O7}: the acid anhydride of permanganic acid, with manganese at +7. It is such a strong oxidizer that organic matter ignites on touching it. Pure {Mn2O7} can explode, so this is strictly a demonstration.","remember":"{Mn2O7} is the anhydride of {HMnO4}. Mn(+7) + any fuel = instant fire.","speed":1,"credit":{"artist":"Maxim Bilovitskiy","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Manganese_oxide_7_and_ethanol.webm"}},{"id":"dispro","topic":"redox","types":["redox","decomposition"],"title":"Ammonium dichromate, ignited","nick":"Chemical volcano","color":"#4f8f3f","colorName":"chromium(III) oxide green","eq":{"l":"(NH4)2Cr2O7(s)","r":"Cr2O3(s) + N2(g) + 4H2O(g)"},"see":"Orange crystals glow and throw sparks, swelling into a heap of fluffy dark green ash.","why":"The ammonium ion is the reducing agent and dichromate the oxidizing agent, packed into one solid. Nitrogen goes from −3 to 0 and chromium from +6 to +3. Escaping {N2} and steam puff up the {Cr2O3}. Strictly, this is an intramolecular redox reaction rather than a disproportionation, which needs one element to go both up and down. Chromium(VI) compounds are carcinogenic.","remember":"Orange Cr(+6) → green {Cr2O3} (+3). Fuel and oxidizer in one salt.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:12._%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%98%D0%B0_%D0%BD%D0%B0_%D0%B4%D0%B8%D1%81%D0%BF%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%86%D0%B8%D0%BE%D0%BD%D0%B8%D1%80%D0%B0%D1%9A%D0%B5.webm"}},{"id":"feso4-h2o2","topic":"redox","types":["redox","precipitation"],"title":"Iron(II) sulfate + hydrogen peroxide","nick":"{Fe^2+} to {Fe^3+}","color":"#c58a2a","colorName":"iron(III) yellow-brown","eq":{"l":"2Fe^2+(aq) + H2O2(aq) + 2H^+(aq)","r":"2Fe^3+(aq) + 2H2O(l)"},"see":"The pale green iron(II) solution turns yellow-brown, and rusty iron(III) hydroxide collects at the surface.","why":"{H2O2} is a good oxidizing agent (E° = +1.78 V in acid) and easily oxidizes {Fe^2+} (E° Fe³⁺/Fe²⁺ = +0.77 V). Without enough acid, the iron(III) hydrolyses and rust-coloured iron(III) hydroxide precipitates.","remember":"Pale green Fe²⁺ → yellow-brown Fe³⁺. Peroxide is the oxidant.","speed":1,"credit":{"artist":"FilHru","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","page":"https://commons.wikimedia.org/wiki/File:Sr%C3%A1%C5%BEec%C3%AD_reakce_s%C3%ADranu_%C5%BEeleznat%C3%A9ho_s_peroxidem.webm"}},{"id":"ki-electrolysis","topic":"redox","types":["electrolysis"],"title":"Electrolysis of potassium iodide solution","nick":"Which ions get discharged?","color":"#c87a2a","colorName":"iodine brown","eq":{"l":"2I^-(aq)","r":"I2(aq) + 2e^-"},"more":[{"label":"Cathode","l":"2H2O(l) + 2e^-","r":"H2(g) + 2OH^-(aq)"},{"label":"Overall","l":"2I^-(aq) + 2H2O(l)","r":"I2(aq) + H2(g) + 2OH^-(aq)"}],"see":"In the U-tube, the cathode arm turns pink (hydroxide meets phenolphthalein) while the anode arm turns yellow-brown with iodine.","why":"At the anode, iodide is oxidized more easily than water, so brown iodine forms. At the cathode, water is reduced far more easily than {K^+} (E° = −2.93 V), so hydrogen bubbles off and hydroxide is left behind. Potassium metal never appears.","remember":"Anode = oxidation, cathode = reduction. Group 1 cations stay in solution; water is reduced instead.","speed":1.5,"credit":{"artist":"North Carolina School of Science and Mathematics","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Electrolysis_Aqueous_KI_with_Graphite_Electrodes.webm"}},{"id":"cu-hno3","topic":"redox","types":["redox","oxidizing acid"],"yt":{"id":"gw-DE61ltX8","start":8,"end":51,"author":"UC Berkeley"},"title":"Copper + concentrated nitric acid","nick":"The acid that dissolves copper","color":"#b5602d","colorName":"nitrogen dioxide brown","eq":{"l":"Cu(s) + 4HNO3(aq)","r":"Cu(NO3)2(aq) + 2NO2(g) + 2H2O(l)"},"more":[{"label":"With dilute acid","l":"3Cu(s) + 8HNO3(aq)","r":"3Cu(NO3)2(aq) + 2NO(g) + 4H2O(l)"}],"see":"Copper in the acid releases dense red-brown gas that fills the cylinder.","why":"Copper cannot reduce H⁺ (E° Cu²⁺/Cu = +0.34 V), so acids like HCl leave it alone. Nitric acid works because nitrate is the oxidizing agent. Concentrated acid is reduced to brown NO₂ (N +4); dilute acid gives mostly colourless NO (N +2), which turns brown once it meets air. The solution is green while NO₂ is dissolved in it and blue once diluted.","remember":"Cu dissolves in HNO₃ but not HCl: nitrate is the oxidant. Concentrated → NO₂, dilute → NO.","credit":{"artist":"UC Berkeley","license":"YouTube","page":"https://www.youtube.com/watch?v=gw-DE61ltX8&t=8s"}},{"id":"al-cucl2","topic":"redox","types":["redox","single displacement"],"yt":{"id":"gqSXWbS6gzo","start":5,"end":31,"author":"NCSSM"},"title":"Aluminium foil + copper(II) chloride","nick":"Chloride breaks the armour","color":"#d9774a","colorName":"copper red-brown","eq":{"l":"2Al(s) + 3CuCl2(aq)","r":"2AlCl3(aq) + 3Cu(s)"},"more":[{"label":"Side reaction in the acidic solution","l":"2Al(s) + 6H^+(aq)","r":"2Al^3+(aq) + 3H2(g)"}],"see":"The foil fizzes and steams in the blue solution, red-brown copper builds up, and the blue fades.","why":"Aluminium is very reactive (E° = −1.66 V) but normally protected by a tough oxide film. Chloride ions break the film down, which is why foil reacts fast with copper(II) chloride but hardly at all with copper(II) sulfate. Hydrated Cu²⁺ makes the solution slightly acidic, so hydrogen bubbles off too, and the whole thing gets hot.","remember":"CuCl₂ + Al: fast. CuSO₄ + Al: slow. Chloride strips the oxide layer.","credit":{"artist":"NCSSM","license":"YouTube","page":"https://www.youtube.com/watch?v=gqSXWbS6gzo&t=5s"}},{"id":"kmno4-h2o2","topic":"redox","types":["redox","titration"],"yt":{"id":"Kln0v_L5ExE","start":3,"end":27,"author":"Periodic Videos"},"title":"Permanganate + acidified hydrogen peroxide","nick":"Purple vanishes","color":"#b03fd6","colorName":"permanganate purple","eq":{"l":"2MnO4^-(aq) + 5H2O2(aq) + 6H^+(aq)","r":"2Mn^2+(aq) + 5O2(g) + 8H2O(l)"},"see":"Purple permanganate poured into the acidified peroxide loses its colour as it mixes, with bubbles of oxygen.","why":"Here hydrogen peroxide is the reducing agent: its oxygen goes from −1 to 0 as O₂ is released, while manganese drops from +7 to almost colourless Mn²⁺. Because the purple disappears until all the peroxide is used up, permanganate acts as its own indicator in titrations.","remember":"H₂O₂ can be a reductant too. Permanganate is self-indicating.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=Kln0v_L5ExE&t=3s"}},{"id":"cuso4-ki","topic":"redox","types":["redox","precipitation"],"yt":{"id":"SG-lygFJjnw","start":25,"end":68,"author":"Ricky Hu"},"title":"Copper(II) sulfate + potassium iodide","nick":"A precipitate drives the redox","color":"#a8642a","colorName":"iodine brown","eq":{"l":"2CuSO4(aq) + 4KI(aq)","r":"2CuI(s) + I2(aq) + 2K2SO4(aq)"},"more":[{"label":"Net ionic","l":"2Cu^2+(aq) + 4I^-(aq)","r":"2CuI(s) + I2(aq)"}],"see":"Blue copper sulfate poured into clear iodide turns a muddy brown with a pale precipitate.","why":"On standard potentials alone, Cu²⁺ should not oxidize iodide (Cu²⁺/Cu⁺ +0.15 V vs I₂/I⁻ +0.54 V). But copper(I) iodide is extremely insoluble, which removes Cu⁺ and pulls the reaction forward. The brown is iodine; the off-white solid is CuI. This reaction underlies the iodometric determination of copper.","remember":"Cu²⁺ + I⁻ → off-white CuI + brown I₂. The precipitate makes it go.","credit":{"artist":"Ricky Hu","license":"YouTube","page":"https://www.youtube.com/watch?v=SG-lygFJjnw&t=25s"}},{"id":"dichromate","topic":"redox","types":["redox","oxidation states"],"yt":{"id":"MKTZhpdl1eE","start":0,"end":21,"author":"The Real Chemist"},"title":"Acidified dichromate + a reducing agent","nick":"Orange to green","color":"#3f9a52","colorName":"chromium(III) green","eq":{"l":"Cr2O7^2-(aq) + 14H^+(aq) + 6e^-","r":"2Cr^3+(aq) + 7H2O(l)"},"more":[{"label":"With ethanol (the old breathalyser)","l":"Cr2O7^2-(aq) + 3C2H5OH(aq) + 8H^+(aq)","r":"2Cr^3+(aq) + 3CH3CHO(aq) + 7H2O(l)"}],"see":"Orange dichromate solution turns green as it is reduced.","why":"Dichromate holds chromium in the +6 state, which is orange. A reducing agent such as ethanol, SO₂ or Fe²⁺ takes it down to green Cr³⁺, and acid is needed to soak up the oxygen as water. Early roadside breathalysers used this colour change to detect ethanol.","remember":"Orange Cr(+6) → green Cr(+3). Needs acid.","credit":{"artist":"The Real Chemist","license":"YouTube","page":"https://www.youtube.com/watch?v=MKTZhpdl1eE&t=0s"}},{"id":"gold-aqua-regia","topic":"redox","types":["redox","complexation"],"yt":{"id":"ssfTsKMSyVE","start":3,"end":18,"author":"Periodic Videos"},"title":"Gold + aqua regia","nick":"Dissolving the noblest metal","color":"#e8a53a","colorName":"tetrachloroaurate orange","eq":{"l":"Au(s) + HNO3(aq) + 4HCl(aq)","r":"HAuCl4(aq) + NO(g) + 2H2O(l)"},"see":"Gold leaf dropped into the orange 1:3 mix of nitric and hydrochloric acids simply disappears.","why":"Nitric acid alone can barely oxidize gold (E° Au³⁺/Au = +1.50 V). Chloride ions grab any Au³⁺ formed as the very stable [AuCl₄]⁻ complex, which lowers the potential needed to about +1.0 V, within reach of nitrate. Neither acid dissolves gold on its own; together they do.","remember":"HNO₃ oxidizes, Cl⁻ complexes. Neither alone dissolves gold.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=ssfTsKMSyVE&t=3s"}},{"id":"cl2-ki","topic":"redox","types":["redox","halogen displacement"],"yt":{"id":"wKSX3NAkUyM","start":0,"end":20,"author":"Nigel Baldwin"},"title":"Chlorine water + potassium iodide","nick":"Halogen displacement","color":"#c06a1a","colorName":"iodine orange-brown","eq":{"l":"Cl2(aq) + 2KI(aq)","r":"2KCl(aq) + I2(aq)"},"see":"Colourless potassium iodide turns orange-brown as chlorine water is added.","why":"Chlorine is a stronger oxidizing agent than iodine (E° +1.36 vs +0.54 V), so it takes electrons from iodide ions. The iodine formed combines with leftover iodide as I₃⁻, which is brown.","remember":"A halogen displaces any halide below it in group 17.","credit":{"artist":"Nigel Baldwin","license":"YouTube","page":"https://www.youtube.com/watch?v=wKSX3NAkUyM&t=0s"}},{"id":"br2-ki","topic":"redox","types":["redox","halogen displacement"],"yt":{"id":"csAuMNJtnAA","start":0,"end":22,"author":"Nigel Baldwin"},"title":"Bromine water + potassium iodide","nick":"Bromine beats iodine","color":"#a8341f","colorName":"triiodide red-brown","eq":{"l":"Br2(aq) + 2KI(aq)","r":"2KBr(aq) + I2(aq)"},"see":"Pale yellow bromine water turns the potassium iodide solution dark red-brown.","why":"Bromine (E° +1.07 V) is a stronger oxidizer than iodine (+0.54 V), so it oxidizes iodide. It cannot oxidize chloride, because chlorine (+1.36 V) is stronger still.","remember":"Br₂ displaces I⁻ but not Cl⁻.","credit":{"artist":"Nigel Baldwin","license":"YouTube","page":"https://www.youtube.com/watch?v=csAuMNJtnAA&t=0s"}},{"id":"thermite","topic":"fire","types":["redox","single displacement"],"title":"Iron oxide + aluminium","nick":"Thermite","color":"#ff7a1a","colorName":"molten iron orange","eq":{"l":"Fe2O3(s) + 2Al(s)","r":"Al2O3(s) + 2Fe(l)"},"see":"A fierce, sparking burn that leaves a glowing pool of molten metal.","why":"Aluminium's affinity for oxygen is enormous: ΔH_f° of {Al2O3} is −1676 kJ/mol against −824 kJ/mol for {Fe2O3}. Swapping the oxygen releases about 850 kJ per mole of {Fe2O3}, enough to reach roughly 2500 °C and melt the iron. In this clip, extra oxides and fluxes produce a small stainless-steel ingot.","remember":"Aluminothermy: Al steals O from less reactive metal oxides. Used to weld rails.","speed":1,"credit":{"artist":"Bilovitskiy","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Thermite.webm"}},{"id":"al-br2","topic":"fire","types":["redox","synthesis"],"title":"Aluminium + bromine","nick":"Metal meets liquid halogen","color":"#c0502a","colorName":"bromine red-brown","eq":{"l":"2Al(s) + 3Br2(l)","r":"Al2Br6(s)"},"see":"Aluminium in a tube of bromine glows red-hot, then erupts in sparks and smoke.","why":"An oxide skin protects aluminium, so there is a short delay. Once bromine breaks through, the very exothermic reaction makes the metal glow. Aluminium bromide exists as the dimer {Al2Br6}: each aluminium is electron-deficient and borrows a lone pair from a bridging bromine.","remember":"{AlX3} is a Lewis acid, so it dimerizes: {Al2Br6} with bridging Br.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:01._%D0%94%D0%B8%D1%80%D0%B5%D0%BA%D1%82%D0%BD%D0%B0_%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B0_%D0%BD%D0%B0_%D0%B0%D0%BB%D1%83%D0%BC%D0%B8%D0%BD%D0%B8%D1%83%D0%BC_%D0%B1%D1%80%D0%BE%D0%BC%D0%B8%D0%B4.webm"}},{"id":"al-i2","topic":"fire","types":["redox","synthesis"],"title":"Aluminium + iodine + a drop of water","nick":"Water is the trigger","color":"#9b4bd1","colorName":"iodine violet","eq":{"l":"2Al(s) + 3I2(s)","r":"2AlI3(s)","over":"H2O"},"see":"After a pause, the powder hisses and erupts in a purple cloud.","why":"Dry, the mixture does nothing. A drop of water acts as a catalyst, letting iodine attack the aluminium. Heat builds, the reaction runs away, and the excess iodine sublimes into the purple cloud.","remember":"The purple cloud is leftover {I2} subliming, not the product.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:06._%D0%94%D0%B8%D1%80%D0%B5%D0%BA%D1%82%D0%BD%D0%B0_%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B0_%D0%BD%D0%B0_%D0%B0%D0%BB%D1%83%D0%BC%D0%B8%D0%BD%D0%B8%D1%83%D0%BC_%D1%98%D0%BE%D0%B4%D0%B8%D0%B4.webm"}},{"id":"zn-s","topic":"fire","types":["redox","synthesis"],"title":"Zinc + sulfur","nick":"Direct synthesis","color":"#e6e2a0","colorName":"zinc sulfide pale yellow","eq":{"l":"Zn(s) + S(s)","r":"ZnS(s)"},"see":"Heated with a torch, the mixed powder suddenly flares and smokes.","why":"Once ignited, zinc and sulfur combine in a fast, very exothermic reaction (ΔH_f° of {ZnS} ≈ −206 kJ/mol) that spreads through the powder by itself. Zinc goes from 0 to +2 and sulfur from 0 to −2.","remember":"Metal + non-metal → binary salt. A combination (synthesis) reaction.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:67._%D0%94%D0%B8%D1%80%D0%B5%D0%BA%D1%82%D0%BD%D0%B0_%D1%81%D0%B8%D0%BD%D1%82%D0%B5%D0%B7%D0%B0_%D0%BD%D0%B0_%D1%86%D0%B8%D0%BD%D0%BA_%D1%81%D1%83%D0%BB%D1%84%D0%B8%D0%B4.ogg"}},{"id":"fe-o2","topic":"fire","types":["redox","combustion"],"title":"Hot steel wool + oxygen","nick":"Iron does burn","color":"#ffcf6b","colorName":"spark gold","eq":{"l":"3Fe(s) + 2O2(g)","r":"Fe3O4(s)"},"see":"Red-hot steel wool bursts into brilliant sparks inside the oxygen tube.","why":"An iron bar will not burn in air, but steel wool has a huge surface area, and pure oxygen is five times more concentrated than air. Both raise the rate. The product is mostly {Fe3O4}, with FeO and {Fe2O3} also possible.","remember":"Same iron, very different rate: surface area and concentration.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:103._%D0%93%D0%BE%D1%80%D0%B5%D1%9A%D0%B5_%D0%B6%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%B0_%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0_%D0%B2%D0%BE_%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%80%D0%BE%D0%B4.webm"}},{"id":"s-o2","topic":"fire","types":["redox","combustion"],"title":"Sulfur + oxygen","nick":"Blue flame, acidic gas","color":"#5b6dff","colorName":"sulfur flame blue","eq":{"l":"S(s) + O2(g)","r":"SO2(g)"},"more":[{"label":"The gas reaches the pink alkaline solution","l":"SO2(g) + 2NaOH(aq)","r":"Na2SO3(aq) + H2O(l)"}],"see":"Sulfur burns violet-blue in oxygen, and the gas it makes takes the pink out of the indicator solution.","why":"{SO2} is an acidic oxide. Bubbled into a basic solution, it neutralizes the hydroxide and phenolphthalein loses its pink. In the air, the same gas leads to sulfurous and sulfuric acid: acid rain.","remember":"Non-metal oxides are acidic: {SO2} + water → {H2SO3}.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:104._%D0%93%D0%BE%D1%80%D0%B5%D1%9A%D0%B5_%D0%BD%D0%B0_%D1%81%D1%83%D0%BB%D1%84%D1%83%D1%80_%D0%B2%D0%BE_%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%80%D0%BE%D0%B4.webm"}},{"id":"p-o2","topic":"fire","types":["redox","combustion"],"title":"Phosphorus + oxygen","nick":"White smoke","color":"#e8ecef","colorName":"{P4O10} white","eq":{"l":"4P(s) + 5O2(g)","r":"P4O10(s)"},"more":[{"label":"The smoke meets water","l":"P4O10(s) + 6H2O(l)","r":"4H3PO4(aq)"}],"see":"Burning red phosphorus flares brilliantly in oxygen and fills the vessel with white smoke.","why":"The smoke is {P4O10} (often written {P2O5}), a white solid and one of the strongest drying agents known. It reacts vigorously with water to give phosphoric acid.","remember":"White smoke = {P4O10}, an acidic oxide and desiccant.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:105._%D0%93%D0%BE%D1%80%D0%B5%D1%9A%D0%B5_%D0%BD%D0%B0_%D1%84%D0%BE%D1%81%D1%84%D0%BE%D1%80_%D0%B2%D0%BE_%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%80%D0%BE%D0%B4.webm"}},{"id":"h2-o2","topic":"fire","types":["redox","combustion"],"title":"Hydrogen balloon + flame","nick":"Fireball","color":"#ff9a3c","colorName":"fireball orange","eq":{"l":"2H2(g) + O2(g)","r":"2H2O(g)"},"see":"The balloon bursts into a rolling orange fireball.","why":"The balloon holds only hydrogen, so it burns only where it mixes with air: a fireball rather than a sharp bang. A pre-mixed 2:1 hydrogen–oxygen balloon detonates far more loudly. A pure hydrogen flame is nearly colourless; the orange comes from the rubber and dust. ΔH = −484 kJ for 2 mol of water vapour.","remember":"Unmixed {H2} → whoosh. Pre-mixed {H2}/{O2} → bang. Product: water.","speed":1,"credit":{"artist":"Maxim Bilovitskiy","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Hydrogen_balloon_explosion_2.webm"}},{"id":"silane","topic":"fire","types":["acid–base","pyrophoric"],"title":"Magnesium silicide + hydrochloric acid","nick":"Self-igniting gas","color":"#fff1c2","colorName":"silane flash","eq":{"l":"Mg2Si(s) + 4HCl(aq)","r":"2MgCl2(aq) + SiH4(g)"},"more":[{"label":"Silane meets air","l":"SiH4(g) + 2O2(g)","r":"SiO2(s) + 2H2O(l)"}],"see":"Bubbles rise and pop into tiny flashes and smoke rings at the surface.","why":"Silane is the silicon version of methane, but unlike {CH4} it is pyrophoric: it ignites in air by itself. Si–H bonds are weaker and more polar than C–H, silicon is larger and easier to attack, and the Si–O bond that forms is very strong. The white smoke is {SiO2}.","remember":"{SiH4} catches fire in air; {CH4} needs a spark. A group 14 trend.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:05._%D0%A0%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%98%D0%B0_%D0%BD%D0%B0_%D0%BC%D0%B0%D0%B3%D0%BD%D0%B5%D0%B7%D0%B8%D1%83%D0%BC_%D1%81%D0%B8%D0%BB%D0%B8%D1%86%D0%B8%D0%B4_%D0%B2%D0%BE_%D1%81%D0%BE%D0%BB%D0%BD%D0%B0_%D0%BA%D0%B8%D1%81%D0%B5%D0%BB%D0%B8%D0%BD%D0%B0.webm"}},{"id":"ni3","topic":"fire","types":["decomposition","explosive"],"title":"Nitrogen triiodide","nick":"Feather-touch explosive","color":"#9b59d0","colorName":"iodine purple","eq":{"l":"2NI3(s)","r":"N2(g) + 3I2(g)"},"more":[{"label":"Making it","l":"3I2(s) + 5NH3(aq)","r":"NI3·NH3(s) + 3NH4I(aq)"}],"see":"Each touch of the dry dark solid sets off a sharp crack and a billowing purple cloud of iodine.","why":"Three large iodine atoms crowd around a small nitrogen, so the N–I bonds are strained and weak, while the product {N2} has one of the strongest bonds known (945 kJ/mol). The activation barrier is tiny, so the lightest touch sets it off.","remember":"Weak, strained N–I bonds + very stable {N2} = contact explosive.","speed":1.25,"credit":{"artist":"Michael Bell","license":"CC BY 3.0","licenseUrl":"https://creativecommons.org/licenses/by/3.0","page":"https://commons.wikimedia.org/wiki/File:Detonating_Nitrogen_triiodide.webm"}},{"id":"chlorate-sugar","topic":"fire","types":["redox","combustion"],"title":"Potassium chlorate + sugar + acid","nick":"One drop to ignite","color":"#c58cff","colorName":"potassium violet","eq":{"l":"8KClO3(s) + C12H22O11(s)","r":"8KCl(s) + 12CO2(g) + 11H2O(g)"},"see":"One drop of concentrated sulfuric acid and the white powder erupts in a blinding violet flash.","why":"Sulfuric acid converts chlorate into chloric acid, which decomposes to chlorine dioxide, an unstable and powerful oxidizer. That ignites the sugar, and the heat drives the main chlorate–sugar reaction. Potassium colours the flame violet.","remember":"Acid turns {ClO3^-} into {ClO2}, which lights the fuel.","speed":1,"credit":{"artist":"Дени Ингилизовски","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:85._%D0%A1%D0%B0%D0%BC%D0%BE%D0%B7%D0%B0%D0%BF%D0%B0%D0%BB%D0%B8%D0%B2%D0%B0_%D1%81%D0%BC%D0%B5%D1%81%D0%B0_%D0%BD%D0%B0_%D0%B1%D0%B0%D0%B7%D0%B0_%D0%BD%D0%B0_%D0%BA%D0%B0%D0%BB%D0%B8%D1%83%D0%BC_%D1%85%D0%BB%D0%BE%D1%80%D0%B0%D1%82,_%D1%88%D0%B5%D1%9C%D0%B5%D1%80_%D0%B8_%D1%81%D1%83%D0%BB%D1%84%D1%83%D1%80%D0%BD%D0%B0_%D0%BA%D0%B8%D1%81%D0%B5%D0%BB%D0%B8%D0%BD%D0%B0.ogg"}},{"id":"nh4-ignition","topic":"fire","types":["redox","catalysis"],"title":"Zinc + {NH4NO3} + {NH4Cl} + water","nick":"Lit by a drop of water","color":"#8fe3d0","colorName":"zinc flame blue-green","eq":{"l":"NH4NO3(s) + Zn(s)","r":"ZnO(s) + N2(g) + 2H2O(g)"},"more":[{"label":"Chloride helps attack the zinc","l":"Zn(s) + 2NH4Cl(s)","r":"ZnCl2(s) + 2NH3(g) + H2(g)"}],"see":"A few drops of water and the pile steams, then bursts into blue-white flame and white smoke.","why":"Water dissolves a little of the salts so the solids can react, and chloride ions strip the oxide layer from the zinc. Ammonium nitrate is both oxidizer and fuel: nitrate oxidizes the zinc while ammonium is oxidized to {N2}. The white smoke is {ZnO}.","remember":"Water starts it, {Cl^-} speeds it, {NH4NO3} is the oxidizer.","speed":1,"credit":{"artist":"Martin.Zapletal","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Ignition_of_Ammonium_Coumpounds_with_Water.webm"}},{"id":"barking-dog","topic":"fire","types":["redox","combustion"],"title":"Carbon disulfide + nitrous oxide","nick":"Barking dog","color":"#6f8cff","colorName":"blue flash","eq":{"l":"8N2O(g) + 4CS2(g)","r":"8N2(g) + 4CO2(g) + S8(s)"},"see":"A brilliant blue-white flash races down the long tube with a loud \"woof\" and leaves yellow sulfur on the glass.","why":"Once lit at the top, the flame front accelerates down the tube; the pressure wave makes the bark. {CS2} is the fuel and {N2O} supplies oxygen, releasing extra energy as it decomposes to {N2}. Sulfur is left as a yellow deposit.","remember":"Blue flash + woof + yellow film of {S8}.","speed":1,"credit":{"artist":"Maxim Bilovitskiy","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Barking_Dog_Reaction.webm"}},{"id":"pharaoh","topic":"fire","types":["decomposition","combustion"],"title":"Mercury(II) thiocyanate, ignited","nick":"Pharaoh's serpent","color":"#e8d9a8","colorName":"carbon nitride yellow","eq":{"l":"2Hg(SCN)2(s)","r":"2HgS(s) + CS2(g) + C3N4(s)"},"more":[{"label":"Carbon disulfide burns","l":"CS2(g) + 3O2(g)","r":"CO2(g) + 2SO2(g)"},{"label":"Mercury sulfide burns","l":"HgS(s) + O2(g)","r":"Hg(g) + SO2(g)"}],"see":"A small pellet grows into a long, curling yellowish \"snake\".","why":"Decomposition releases gases that inflate a solid carbon nitride ({C3N4}) foam, which keeps extruding from the burning pellet. It is rarely done now because it releases mercury vapour and {SO2}, both toxic.","remember":"The snake is {C3N4} foam blown up by gases. Releases toxic Hg vapour.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:51._%D0%A4%D0%B0%D1%80%D0%B0%D0%BE%D0%BD_%D0%B7%D0%BC%D0%B8%D1%98%D0%B0.ogg"}},{"id":"fe-s","topic":"fire","types":["redox","synthesis"],"yt":{"id":"PB8tSJjnQK8","start":0,"end":38,"author":"lgschemistry"},"title":"Iron + sulfur","nick":"Mixture to compound","color":"#ff7a2a","colorName":"red-hot glow","eq":{"l":"Fe(s) + S(s)","r":"FeS(s)"},"see":"A test tube of mixed iron and sulfur powder is heated: the sulfur melts, then the mixture glows red-hot and keeps glowing after the flame is removed.","why":"The reaction is exothermic (ΔH_f° of FeS ≈ −100 kJ/mol), so once one spot is hot enough, the heat it releases ignites the next. Before heating, a magnet can pull the iron out of the mixture; afterwards the iron is locked into the compound iron(II) sulfide and the magnet no longer separates it.","remember":"Mixture: magnet separates it. Compound (FeS): it doesn't.","credit":{"artist":"lgschemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=PB8tSJjnQK8&t=0s"}},{"id":"al-cl2","topic":"fire","types":["redox","synthesis"],"yt":{"id":"aK85PZX2xNE","start":3,"end":28,"author":"Periodic Videos"},"title":"Aluminium + chlorine gas","nick":"Foil bursts into flame","color":"#d7e24a","colorName":"chlorine yellow-green","eq":{"l":"2Al(s) + 3Cl2(g)","r":"Al2Cl6(s)"},"see":"Heated aluminium foil lowered into a flask of yellow-green chlorine flares into brilliant white light and smoke.","why":"Chlorine is a strong oxidizer (E° = +1.36 V) and aluminium a strong reductant. Once the oxide skin is breached, the reaction is violently exothermic. Aluminium chloride is a Lewis acid that exists as the dimer Al₂Cl₆; it is the classic Friedel–Crafts catalyst.","remember":"Al + halogen → violent. AlCl₃ is a Lewis acid (Al₂Cl₆ dimer).","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=aK85PZX2xNE&t=3s"}},{"id":"cu-cl2","topic":"fire","types":["redox","synthesis"],"yt":{"id":"edLpxdERQZc","start":9,"end":47,"author":"NCSSM"},"title":"Copper + chlorine gas","nick":"Chlorine does what HCl can't","color":"#3fbfa0","colorName":"copper(II) chloride blue-green","eq":{"l":"Cu(s) + Cl2(g)","r":"CuCl2(s)"},"see":"Hot copper foil glows in a jar of yellow-green chlorine; water then dissolves the product to a blue-green solution.","why":"Hydrochloric acid can't oxidize copper because H⁺ is too weak an oxidant, but chlorine (E° = +1.36 V) easily takes copper to +2. The blue-green colour of the solution comes from copper(II) with both water and chloride ligands.","remember":"Cl₂ oxidizes Cu; HCl can't.","credit":{"artist":"NCSSM","license":"YouTube","page":"https://www.youtube.com/watch?v=edLpxdERQZc&t=9s"}},{"id":"fe-halogens","topic":"fire","types":["redox","group trends"],"yt":{"id":"EvtyMr5EvBY","start":25,"end":99,"rate":1.5,"author":"Royal Society of Chemistry"},"title":"Hot iron wool + {Cl2}, {Br2} and {I2}","nick":"Group 17 reactivity in three tubes","color":"#c0502a","colorName":"bromine red-brown","eq":{"l":"2Fe(s) + 3Cl2(g)","r":"2FeCl3(s)"},"more":[{"label":"Bromine","l":"2Fe(s) + 3Br2(g)","r":"2FeBr3(s)"},{"label":"Iodine stops at iron(II)","l":"Fe(s) + I2(g)","r":"FeI2(s)"}],"see":"Hot iron wool glows brightly in chlorine, less in bromine vapour, and only faintly in iodine vapour.","why":"Oxidizing power falls down group 17 (E°: Cl₂ +1.36, Br₂ +1.07, I₂ +0.54 V), so the reactions get less vigorous. Iodine only makes FeI₂: Fe³⁺ would oxidize iodide back to iodine (2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂), so FeI₃ can't survive.","remember":"F > Cl > Br > I. Iron + iodine gives FeI₂, not FeI₃.","credit":{"artist":"Royal Society of Chemistry","license":"YouTube","page":"https://www.youtube.com/watch?v=EvtyMr5EvBY&t=25s"}},{"id":"h2-cl2","topic":"fire","types":["radical chain","photochemistry"],"yt":{"id":"S0eKJZKfMBg","start":0,"end":30,"author":"ChemPics"},"title":"Hydrogen + chlorine + light","nick":"A flash sets it off","color":"#f2f0a0","colorName":"flash white","eq":{"l":"H2(g) + Cl2(g)","r":"2HCl(g)","over":"light"},"more":[{"label":"Initiation","l":"Cl2","r":"2Cl•","over":"light"},{"label":"Propagation","l":"Cl• + H2","r":"HCl + H•"},{"label":"Propagation","l":"H• + Cl2","r":"HCl + Cl•"}],"see":"A tube of the gas mixture explodes the moment a bright flash of light hits it.","why":"In the dark the mixture is stable. A photon breaks a Cl–Cl bond (243 kJ/mol), and the chlorine atoms start a chain: each step makes HCl and regenerates a radical, so one photon can produce up to a million HCl molecules. The chain runs away into an explosion.","remember":"Light → Cl• → radical chain → bang. Stable in the dark.","credit":{"artist":"ChemPics","license":"YouTube","page":"https://www.youtube.com/watch?v=S0eKJZKfMBg&t=0s"}},{"id":"white-p","topic":"fire","types":["redox","allotropes"],"yt":{"id":"LK82rjh8E80","start":0,"end":55,"author":"NileRed"},"title":"White phosphorus + air","nick":"Catches fire by itself","color":"#f2ead0","colorName":"phosphorus smoke white","eq":{"l":"P4(s) + 5O2(g)","r":"P4O10(s)"},"see":"Waxy white phosphorus taken out of water starts to smoke and soon bursts into flame on its own.","why":"White phosphorus is made of P₄ tetrahedra with 60° bond angles, so the bonds are badly strained and very reactive. It ignites in air at around 30 °C and is stored under water. Red phosphorus, a polymeric allotrope, is far more stable, which is why it is the one used on matchboxes.","remember":"White P: strained P₄, stored under water. Red P: polymer, stable.","credit":{"artist":"NileRed","license":"YouTube","page":"https://www.youtube.com/watch?v=LK82rjh8E80&t=0s"}},{"id":"zn-i2","topic":"fire","types":["redox","synthesis"],"yt":{"id":"IEG8r_w0iY8","start":3,"end":40,"author":"Mr. Everett"},"title":"Zinc + iodine + a drop of water","nick":"Purple eruption","color":"#c43fb0","colorName":"iodine vapour purple","eq":{"l":"Zn(s) + I2(s)","r":"ZnI2(s)","over":"H2O"},"see":"A few drops of water on the zinc–iodine mixture and purple vapour pours out of the tube.","why":"As with aluminium and iodine, water lets the two solids react. The reaction is exothermic, and the heat sublimes the excess iodine into the purple cloud. The product, zinc iodide, is colourless; the brown liquid left is iodine dissolved in the zinc iodide solution.","remember":"Purple = subliming I₂. Water is the trigger.","credit":{"artist":"Mr. Everett","license":"YouTube","page":"https://www.youtube.com/watch?v=IEG8r_w0iY8&t=3s"}},{"id":"f2-charcoal","topic":"fire","types":["redox","halogens"],"yt":{"id":"-_7axQ7YAnE","start":3,"end":14,"author":"Periodic Videos"},"title":"Fluorine gas + charcoal","nick":"The strongest oxidizer","color":"#e8e070","colorName":"fluorine pale yellow","eq":{"l":"C(s) + 2F2(g)","r":"CF4(g)"},"see":"Charcoal bursts into flame the moment fluorine gas reaches it, with no other ignition.","why":"Fluorine is the most powerful elemental oxidizer (E° = +2.87 V). Its F–F bond is unusually weak (159 kJ/mol) because the small atoms' lone pairs repel, while the C–F bonds it forms are among the strongest single bonds known. Huge energy release and a tiny barrier make it attack almost anything.","remember":"Weak F–F bond + strong bonds to F = fluorine attacks everything.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=-_7axQ7YAnE&t=3s"}},{"id":"f2-sulfur","topic":"fire","types":["redox","halogens"],"yt":{"id":"ca4JtA_EZzY","start":3,"end":25,"author":"Periodic Videos"},"title":"Fluorine gas + sulfur","nick":"Making SF₆","color":"#e6d34a","colorName":"sulfur yellow","eq":{"l":"S(s) + 3F2(g)","r":"SF6(g)"},"see":"Yellow sulfur ignites as fluorine flows over it and burns away.","why":"Fluorine pushes sulfur all the way to its highest oxidation state, +6. The product, SF₆, is octahedral and remarkably inert because the six fluorines shield the sulfur from attack. It is used as an insulating gas in high-voltage equipment.","remember":"Fluorine brings out maximum oxidation states: S → SF₆.","credit":{"artist":"Periodic Videos","license":"YouTube","page":"https://www.youtube.com/watch?v=ca4JtA_EZzY&t=3s"}},{"id":"elephant","topic":"oxygen","types":["decomposition","catalysis"],"title":"Hydrogen peroxide + potassium iodide","nick":"Elephant toothpaste","color":"#e7c46a","colorName":"iodine-tinted foam","eq":{"l":"2H2O2(aq)","r":"2H2O(l) + O2(g)","over":"I^-"},"more":[{"label":"Step 1 (slow)","l":"H2O2(aq) + I^-(aq)","r":"H2O(l) + IO^-(aq)"},{"label":"Step 2 (fast)","l":"H2O2(aq) + IO^-(aq)","r":"H2O(l) + O2(g) + I^-(aq)"}],"see":"A column of warm, steaming foam shoots out of the cylinder.","why":"Iodide is a catalyst: consumed in step 1 and returned in step 2, so it does not appear in the overall equation. Detergent traps the oxygen as foam. The reaction is exothermic (about −98 kJ per mole of {H2O2}), so the foam steams, and a little iodine tints it yellow.","remember":"A catalyst is used up, then regenerated. It never shows in the overall equation.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:14._%D0%A1%D0%BB%D0%BE%D0%BD%D0%BE%D0%B2%D1%81%D0%BA%D0%B0_%D0%BF%D0%B0%D1%81%D1%82%D0%B0_%D0%B7%D0%B0_%D0%B7%D0%B0%D0%B1%D0%B8.webm"}},{"id":"h2o2-mno2","topic":"oxygen","types":["decomposition","catalysis"],"title":"Hydrogen peroxide + manganese dioxide","nick":"Heterogeneous catalysis","color":"#dfe6e8","colorName":"steam white","eq":{"l":"2H2O2(aq)","r":"2H2O(l) + O2(g)","over":"MnO2"},"see":"A dark solid dropped into concentrated peroxide sets off a hissing cloud of steam.","why":"{MnO2} is a solid catalyst for a reaction in solution: heterogeneous catalysis. Its surface offers a lower-energy pathway, and it is still there, unchanged, at the end. The decomposition releases so much heat that water boils off as steam. Test: oxygen relights a glowing splint.","remember":"{MnO2} speeds it up and survives. Oxygen relights a glowing splint.","speed":1,"credit":{"artist":"Petrovskyz","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:13._%D0%9A%D0%B0%D1%82%D0%B0%D0%BB%D0%B8%D1%82%D0%B8%D1%87%D0%BA%D0%BE_%D1%80%D0%B0%D0%B7%D0%BB%D0%BE%D0%B6%D1%83%D0%B2%D0%B0%D1%9A%D0%B5_%D0%BD%D0%B0_%D0%B2%D0%BE%D0%B4%D0%BE%D1%80%D0%BE%D0%B4_%D0%BF%D0%B5%D1%80%D0%BE%D0%BA%D1%81%D0%B8%D0%B4.webm"}},{"id":"singlet-o2","topic":"oxygen","types":["redox","chemiluminescence"],"title":"Chlorine + alkaline hydrogen peroxide","nick":"Red glow of singlet oxygen","color":"#ff3b3b","colorName":"634 nm red","eq":{"l":"Cl2(g) + H2O2(aq) + 2OH^-(aq)","r":"2Cl^-(aq) + 2H2O(l) + ¹O2(g)"},"more":[{"label":"Making the chlorine","l":"2KMnO4(s) + 16HCl(aq)","r":"2KCl(aq) + 2MnCl2(aq) + 5Cl2(g) + 8H2O(l)"},{"label":"The glow","l":"2 ¹O2(g)","r":"2 ³O2(g) + photon (634 nm)"}],"see":"Each bubble of chlorine glows red as it passes through the bubbler.","why":"The oxygen is born in an excited singlet state, with its two outermost electrons paired in one π* orbital. Returning to the normal triplet ground state is spin-forbidden, so it is slow. When two excited molecules collide they can emit one red photon together at 634 nm. This is chemiluminescence.","remember":"Red glow = pairs of singlet {O2} relaxing. Light from a reaction, not from heat.","speed":1,"credit":{"artist":"Deni Ingilizovski","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:110._%D0%A1%D0%B8%D0%BD%D0%B3%D0%BB%D0%B5%D1%82%D0%B5%D0%BD_%D0%BA%D0%B8%D1%81%D0%BB%D0%BE%D1%80%D0%BE%D0%B4_(%D1%85%D0%B5%D0%BC%D0%B8%D0%BB%D1%83%D0%BC%D0%B8%D0%BD%D0%B8%D1%81%D1%86%D0%B5%D0%BD%D1%86%D0%B8%D1%98%D0%B0).webm"}},{"id":"cro5","topic":"oxygen","types":["redox","complex"],"title":"Dichromate + hydrogen peroxide (+ ether)","nick":"Blue chromium peroxide","color":"#2f5fe0","colorName":"{CrO5} blue","eq":{"l":"Cr2O7^2-(aq) + 4H2O2(aq) + 2H^+(aq)","r":"2CrO(O2)2 + 5H2O(l)"},"more":[{"label":"First, chromate is acidified","l":"2CrO4^2-(aq) + 2H^+(aq)","a":"\u003c=>","r":"Cr2O7^2-(aq) + H2O(l)"}],"see":"Under a layer of ether, adding peroxide turns the solution deep blue; the colour then moves up into the ether.","why":"{CrO5}, written {CrO(O2)2}, has one oxo and two peroxo ligands. Chromium stays at +6, because peroxide oxygens count −1 each. The compound decomposes quickly in water but survives in ether, so it is extracted into the top layer. It is a classic test for Cr(VI) or for {H2O2}.","remember":"Blue in ether = {CrO(O2)2}. Chromium is still +6.","speed":1,"credit":{"artist":"Hugo","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Oxodiperoxochromium-complex.webm"}},{"id":"golden-rain","topic":"precip","types":["precipitation","solubility"],"title":"Lead(II) nitrate + potassium iodide","nick":"Golden rain","color":"#f5c518","colorName":"lead iodide yellow","eq":{"l":"Pb(NO3)2(aq) + 2KI(aq)","r":"PbI2(s) + 2KNO3(aq)"},"more":[{"label":"Net ionic","l":"Pb^2+(aq) + 2I^-(aq)","r":"PbI2(s)"}],"see":"Mixing the clear solutions gives a bright yellow solid. Heated until it dissolves, then cooled, it returns as glittering golden flakes.","why":"Lead(II) iodide is far more soluble in hot water than in cold. Dissolved hot and cooled slowly, it recrystallizes as thin hexagonal plates that sparkle like gold leaf. Lead compounds are toxic.","remember":"{PbI2} is bright yellow, and its solubility rises steeply with temperature.","speed":2,"credit":{"artist":"Sartnuphon","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","page":"https://commons.wikimedia.org/wiki/File:Golden_rain_demonstration.webm"}},{"id":"ag-halides","topic":"precip","types":["precipitation","analysis"],"title":"Silver nitrate + halide ions","nick":"The halide test","color":"#e9d57a","colorName":"silver iodide yellow","eq":{"l":"Ag^+(aq) + X^-(aq)","r":"AgX(s)"},"pairs":[["F^-","no precipitate","#9aa7a5"],["Cl^-","white","#f2f4f4"],["Br^-","cream","#eadfb4"],["I^-","pale yellow","#e9d57a"]],"see":"Fluoride stays clear; chloride gives a white precipitate, bromide cream, iodide pale yellow.","why":"AgF dissolves because the small fluoride ion is very strongly hydrated. Down the group the halide grows larger and more polarizable, the Ag–X bond becomes more covalent, and the solid becomes less soluble: Ksp(AgCl) = 1.8 × 10⁻¹⁰, Ksp(AgBr) = 5.0 × 10⁻¹³, Ksp(AgI) = 8.5 × 10⁻¹⁷. The colour deepens the same way.","remember":"F soluble · Cl white · Br cream · I yellow.","speed":1,"credit":{"artist":"Hugo","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Solubility_of_silver_halides.webm"}},{"id":"ag-precip","topic":"precip","types":["precipitation","solubility"],"title":"Silver chromate, then chloride added","nick":"Which precipitate wins?","color":"#b5452b","colorName":"silver chromate brick red","eq":{"l":"2Ag^+(aq) + CrO4^2-(aq)","r":"Ag2CrO4(s)"},"more":[{"label":"Chloride is added","l":"Ag2CrO4(s) + 2Cl^-(aq)","r":"2AgCl(s) + CrO4^2-(aq)"}],"see":"Silver nitrate turns yellow chromate solution into a brick-red precipitate, which goes pale as chloride is added.","why":"Silver chromate's Ksp (1.1 × 10⁻¹²) is smaller than silver chloride's (1.8 × 10⁻¹⁰), but the formulas differ, so compare molar solubilities: about 6.5 × 10⁻⁵ M for {Ag2CrO4} versus 1.3 × 10⁻⁵ M for AgCl. AgCl is less soluble, so the red solid converts to white. The Mohr titration relies on this: red only appears once all the chloride is gone.","remember":"When formulas differ, compare molar solubility, not Ksp. Mohr titration endpoint.","speed":1,"credit":{"artist":"Hugo","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","page":"https://commons.wikimedia.org/wiki/File:Precipitation_of_Ag2CrO4_and_AgCl.webm"}},{"id":"fe-oh","topic":"precip","types":["precipitation"],"title":"Iron(III) chloride + hydroxide","nick":"Rust-brown precipitate","color":"#b45a28","colorName":"iron(III) hydroxide rust","eq":{"l":"FeCl3(aq) + 3KOH(aq)","r":"Fe(OH)3(s) + 3KCl(aq)"},"more":[{"label":"Compare iron(II)","l":"Fe^2+(aq) + 2OH^-(aq)","r":"Fe(OH)2(s), dirty green"}],"see":"A rust-brown, jelly-like precipitate forms instantly.","why":"Iron(III) hydroxide (really hydrated iron(III) oxide) is extremely insoluble, with Ksp nea
